name: Run device tests
description: Run selected device entries with common correctness defaults and deadlines.

inputs:
  platform:
    description: a2a3 or a5.
    required: true
  files:
    description: Space-separated entry paths from detect_changes.py; empty runs no cases.
    required: true
  workers:
    description: Concurrent golden workers. Up to twice this many entries can hold prepared tensors.
    required: false
    default: '2'
  compile-workers:
    description: Concurrent entries compiling PyPTO programs and native chip binaries.
    required: false
    default: '8'

runs:
  using: composite
  steps:
    - name: Run selected cases
      shell: bash
      working-directory: checkout
      env:
        FILES: ${{ inputs.files }}
        PLATFORM: ${{ inputs.platform }}
        PYPTO_CI_DEVICE_WORKERS: ${{ inputs.workers }}
        PYPTO_CI_COMPILE_WORKERS: ${{ inputs.compile-workers }}
      run: bash .github/scripts/run_device_tests.sh
