name: CI CPU fixture diagnostic

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-cpu-fixtures-${{ github.ref }}
  cancel-in-progress: false

jobs:
  export-fixtures:
    runs-on: [self-hosted, linux, x64, cpu]
    timeout-minutes: 60
    defaults:
      run:
        working-directory: checkout
    env:
      PTOAS_ROOT: ${{ github.workspace }}/checkout/ptoas-bin
      CMAKE_BUILD_PARALLEL_LEVEL: 2
      MAX_JOBS: 2
      CMAKE_C_COMPILER_LAUNCHER: ccache
      CMAKE_CXX_COMPILER_LAUNCHER: ccache
      CCACHE_MAXSIZE: 30G
      CCACHE_UMASK: '000'
    steps:
      - name: Fetch unchanged setup action
        uses: actions/checkout@v4
        with:
          sparse-checkout: .github/actions
          clean: false
          persist-credentials: false

      - name: Setup pinned CPU job
        uses: ./.github/actions/setup-ci-job
        with:
          checkout-path: checkout
          needs-device: 'false'
          build-namespace: fixture-export-afe8177
          pip-cache-name: pip-fixture-export
          toolchain: bundle
          torch-version: 'torch==2.10.0'
          pypto-ref: afe81773c33ef041d97f81e473c06618b961ecda

      - name: Export original inputs and CPU goldens
        shell: bash
        env:
          PYTHONPATH: ${{ github.workspace }}/checkout
        run: |
          source activate.sh
          test "$(uname -m)" = x86_64
          test -z "${TASK_DEVICE:-}"
          destination="fixture-export-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          test ! -e "$destination"
          mkdir "$destination"
          failed=0
          for entry in c1a c2a sparse; do
            if ! python .github/scripts/export_ci_fixtures.py --entry "$entry" \
                --output "$destination/$entry" >"$destination/$entry.log" 2>&1; then
              failed=1
              echo "::error::CPU fixture export failed: $entry"
            fi
          done
          exit "$failed"

      - name: Upload synthetic fixtures and metadata
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e79-afe8177-x86-cpu-fixtures-${{ github.run_id }}-${{ github.run_attempt }}
          path: checkout/fixture-export-${{ github.run_id }}-${{ github.run_attempt }}/
          if-no-files-found: warn
          retention-days: 3
          compression-level: 1
