name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# A5 jobs use the `pr` runner pool for pull requests, main pushes, and manual runs.
# CPU and A3 jobs keep their existing shared runner selection.
jobs:
  pre-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - uses: pre-commit/action@v3.0.0
        with:
          extra_args: --all-files

  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-unit-tests
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest numpy safetensors
          pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Run unit tests
        run: pytest tests -v

  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      sim_matrix: ${{ steps.check.outputs.sim_matrix }}
      a2a3_files: ${{ steps.check.outputs.a2a3_files }}
      device_matrix: ${{ steps.check.outputs.device_matrix }}
      a2a3sim_files: ${{ steps.check.outputs.a2a3sim_files }}
      a5sim_files: ${{ steps.check.outputs.a5sim_files }}
      run_qwen_serving_tests: ${{ steps.check.outputs.run_qwen_serving_tests }}
      run_qwen_vllm_eager: ${{ steps.check.outputs.run_qwen_vllm_eager }}
      run_deepseek_serving_tests: ${{ steps.check.outputs.run_deepseek_serving_tests }}
      run_dspark_serving_tests: ${{ steps.check.outputs.run_dspark_serving_tests }}
      a5_files: ${{ steps.check.outputs.a5_files }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - id: check
        shell: bash
        run: |
          set -euo pipefail

          echo "run_qwen_serving_tests=false" >> "$GITHUB_OUTPUT"
          echo "run_qwen_vllm_eager=false" >> "$GITHUB_OUTPUT"
          echo "run_deepseek_serving_tests=false" >> "$GITHUB_OUTPUT"
          echo "run_dspark_serving_tests=false" >> "$GITHUB_OUTPUT"
          select_all=false
          if [ "${{ github.event_name }}" = "push" ] ||
             [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            select_all=true
          elif [ "${{ github.event_name }}" = "pull_request" ]; then
            DIFF_RANGE="${{ github.event.pull_request.base.sha }}...${{ github.event.pull_request.head.sha }}"
          else
            BEFORE="${{ github.event.before }}"
            if [ -z "$BEFORE" ] ||
               [ "$BEFORE" = "0000000000000000000000000000000000000000" ] ||
               ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null ||
               ! git merge-base --is-ancestor "$BEFORE" "${{ github.sha }}"; then
              select_all=true
            else
              DIFF_RANGE="$BEFORE..${{ github.sha }}"
            fi
          fi

          CHANGED_FILES=""
          if [ "$select_all" = "false" ]; then
            CHANGED_FILES=$(git diff --name-only "$DIFF_RANGE")

          fi

          # Device and simulator entries share platform ownership; simulator
          # selection additionally honors file-level exclusions such as no-sim.
          SIM_PLATFORMS=()
          DEVICE_PLATFORMS=()
          for platform in a2a3 a2a3sim a5 a5sim; do
            # Main pushes run the full examples suite on A2/A3 and both
            # simulators; A5 device coverage stays in PR and daily CI.
            if [ "${{ github.event_name }}" = "push" ] && [ "$platform" = "a5" ]; then
              FILES=""
            elif [ "$select_all" = "true" ]; then
              FILES=$(python .github/scripts/detect_changes.py --all --root examples --platform "$platform")
            else
              FILES=$(printf '%s\n' "$CHANGED_FILES" | python .github/scripts/detect_changes.py --platform "$platform")
            fi
            echo "${platform}_files=$FILES" >> "$GITHUB_OUTPUT"
            if [[ "$platform" = *sim ]] && [ -n "$FILES" ]; then
              SIM_PLATFORMS+=("$platform")
            elif [ -n "$FILES" ]; then
              DEVICE_PLATFORMS+=("$platform")
            fi
            echo "Selected $platform files: $FILES"
          done
          SIM_MATRIX=$(python -c 'import json, sys; print(json.dumps(sys.argv[1:]))' "${SIM_PLATFORMS[@]}")
          echo "sim_matrix=$SIM_MATRIX" >> "$GITHUB_OUTPUT"
          DEVICE_MATRIX=$(python -c 'import json, sys; print(json.dumps(sys.argv[1:]))' "${DEVICE_PLATFORMS[@]}")
          echo "device_matrix=$DEVICE_MATRIX" >> "$GITHUB_OUTPUT"

          # Serving e2e jobs are model-specific and expensive. CI-infra edits
          # (.github/**) must not trigger them.
          if [ "${{ github.event_name }}" = "pull_request" ] &&
             printf '%s\n' "$CHANGED_FILES" | grep -qE '^models/qwen3_14b/'; then
            echo "run_qwen_serving_tests=true" >> "$GITHUB_OUTPUT"
          fi
          if [ "${{ github.event_name }}" = "pull_request" ] &&
             printf '%s\n' "$CHANGED_FILES" | grep -qE '^(models/qwen3_14b/|\.github/scripts/qwen-vllm-kernel/)'; then
            echo "run_qwen_vllm_eager=true" >> "$GITHUB_OUTPUT"
          fi
          if [ "${{ github.event_name }}" = "pull_request" ] &&
             printf '%s\n' "$CHANGED_FILES" | grep -qE '^models/deepseek_v4_flash_mtp/'; then
            echo "run_deepseek_serving_tests=true" >> "$GITHUB_OUTPUT"
          fi
          if [ "${{ github.event_name }}" = "pull_request" ] &&
             printf '%s\n' "$CHANGED_FILES" | grep -qE '^models/deepseek_v4_flash_dspark/'; then
            echo "run_dspark_serving_tests=true" >> "$GITHUB_OUTPUT"
          fi

  sim:
    needs: detect-changes
    if: needs.detect-changes.outputs.sim_matrix != '[]'
    # Simulator job: no device needed, so it runs on the CPU runner — but on the
    # host, through the same setup-ci-job composite as the a2a3 device job (same
    # user, same bundle venv + activate.sh, same ci-cache). needs-device:false is
    # the only difference: no Ascend env, which the simulator does not use.
    runs-on: [self-hosted, linux, cpu]
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        platform: ${{ fromJSON(needs.detect-changes.outputs.sim_matrix) }}
    defaults:
      run:
        working-directory: checkout
    env:
      PTOAS_ROOT: ${{ github.workspace }}/checkout/ptoas-bin
      CMAKE_BUILD_PARALLEL_LEVEL: 16
      CMAKE_C_COMPILER_LAUNCHER: ccache
      CMAKE_CXX_COMPILER_LAUNCHER: ccache
      CCACHE_MAXSIZE: 30G
      # Shared with the a2a3 job; 000 keeps cache files mutually writable. Both
      # jobs now run as ci-runner (no container root), but the dir still holds
      # root-owned entries from the container era, so keep the umask.
      # The cache *paths* are exported by setup-ci-job from the runner config's
      # CI_CACHE_ROOT — a static job-level env: cannot see a step's output.
      CCACHE_UMASK: '000'

    steps:
      - name: Fetch composite action definitions
        # Local `uses: ./.github/actions/...` resolves against $GITHUB_WORKSPACE,
        # but this job checks the repo out into ./checkout — sparse-fetch just
        # the action defs at the workspace root first (clean: false leaves sibling
        # subdir checkouts on this persistent runner untouched).
        uses: actions/checkout@v4
        with:
          sparse-checkout: .github/actions
          clean: false
          persist-credentials: false

      - name: Setup CI job
        uses: ./.github/actions/setup-ci-job
        with:
          checkout-path: checkout
          needs-device: 'false'
          runtime-platform: ${{ matrix.platform }}
          build-namespace: ${{ matrix.platform }}
          pip-cache-name: pip-sim
          toolchain: bundle
          # A5 simulation uses the MXFP8 scale dtype torch.float8_e8m0fnu.
          torch-version: ${{ matrix.platform == 'a5sim' && 'torch==2.10.0' || 'torch==2.6.0' }}

      - name: Run simulator tests
        uses: ./.github/actions/run-sim-tests
        with:
          platform: ${{ matrix.platform }}
          files: ${{ needs.detect-changes.outputs[format('{0}_files', matrix.platform)] }}

  device:
    name: device (${{ matrix.platform }})
    needs: detect-changes
    if: needs.detect-changes.outputs.device_matrix != '[]'
    strategy:
      fail-fast: false
      matrix:
        platform: ${{ fromJSON(needs.detect-changes.outputs.device_matrix) }}
    runs-on: ${{ fromJSON(matrix.platform == 'a5' && '["self-hosted", "linux", "npu-a5", "pr"]' || '["self-hosted", "linux", "npu", "a3"]') }}
    # Must exceed a single task-submit's worst case (--timeout 3600 queue wait +
    # --max-time 900 run), or the job dies before task-submit's own timeout can
    # ever fire — and the first queued case would eat the whole job budget.
    timeout-minutes: 120
    defaults:
      run:
        working-directory: checkout
    env:
      PTOAS_ROOT: ${{ github.workspace }}/checkout/ptoas-bin
      CMAKE_BUILD_PARALLEL_LEVEL: 16
      CMAKE_C_COMPILER_LAUNCHER: ccache
      CMAKE_CXX_COMPILER_LAUNCHER: ccache
      CCACHE_MAXSIZE: 30G
      # Shared with the sim job via the same ci-cache dir; 000 keeps cache files
      # mutually writable. Both jobs now run as ci-runner, but the dir still holds
      # root-owned entries from the container era, so keep the umask.
      # The cache *paths* are exported by setup-ci-job from the runner config's
      # CI_CACHE_ROOT — a static job-level env: cannot see a step's output.
      CCACHE_UMASK: '000'

    steps:
      - name: Fetch composite action definitions
        # Local `uses: ./.github/actions/...` resolves against $GITHUB_WORKSPACE,
        # but this job checks the repo out into ./checkout — sparse-fetch just
        # the action defs at the workspace root first (clean: false leaves sibling
        # subdir checkouts on this persistent runner untouched).
        uses: actions/checkout@v4
        with:
          sparse-checkout: .github/actions
          clean: false
          persist-credentials: false

      - name: Setup CI job
        uses: ./.github/actions/setup-ci-job
        with:
          checkout-path: checkout
          needs-device: 'true'
          runtime-platform: ${{ matrix.platform }}
          build-namespace: ${{ matrix.platform }}-ci
          pip-cache-name: pip-${{ matrix.platform }}
          toolchain: bundle
          torch-version: 'torch==2.10.0'

      - name: Run device tests
        uses: ./.github/actions/run-device-tests
        with:
          platform: ${{ matrix.platform }}
          files: ${{ needs.detect-changes.outputs[format('{0}_files', matrix.platform)] }}

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}-failure-diagnostics
          retention-days: 7
          if-no-files-found: ignore
          path: |
            checkout/build_output/**/report/codegen_errors.txt
            checkout/build_output/**/*.pto

      - name: Kill orphaned task-submit tasks
        if: always()
        uses: ./.github/actions/kill-orphaned-tasks
        with:
          checkout-path: checkout

      - name: Clean up build artifacts
        if: always()
        working-directory: checkout
        run: rm -rf build_output

  qwen-vllm-eager:
    # Preserve the established check/cache identities; the adapter covers both
    # eager and capture under .github/scripts/qwen-vllm-kernel/.
    needs: detect-changes
    if: >-
      github.event_name == 'workflow_dispatch' ||
      needs.detect-changes.outputs.run_qwen_vllm_eager == 'true'
    runs-on: [self-hosted, linux, npu, a3]
    timeout-minutes: 120
    env:
      PTOAS_ROOT: ${{ github.workspace }}/checkout-vllm/ptoas-bin
      # The A3 runner's GitHub HTTP/2 connection can close mid-checkout.
      GIT_CONFIG_COUNT: '1'
      GIT_CONFIG_KEY_0: http.https://github.com/.version
      GIT_CONFIG_VALUE_0: HTTP/1.1
      CMAKE_BUILD_PARALLEL_LEVEL: 8
      CMAKE_C_COMPILER_LAUNCHER: ccache
      CMAKE_CXX_COMPILER_LAUNCHER: ccache
      CCACHE_MAXSIZE: 30G
      CCACHE_UMASK: '000'
    steps:
      - name: Fetch composite action definitions
        uses: actions/checkout@v4
        with:
          sparse-checkout: .github/actions
          clean: false
          persist-credentials: false
      - name: Set up the pinned compiler
        uses: ./.github/actions/setup-ci-job
        with:
          checkout-path: checkout-vllm
          needs-device: 'true'
          runtime-platform: a2a3
          build-namespace: qwen-vllm-eager
          pip-cache-name: pip-qwen-vllm-eager
          toolchain: bundle
          pypto-ref: 04aed6915460a98d1ecd07fe29c6e0e7c6da3022
          torch-version: 'torch==2.10.0'
      - name: Fetch the pinned Simpler capture runtime
        uses: actions/checkout@v4
        with:
          repository: hw-native-sys/simpler
          ref: 20af3c1d25aa4cc04f22680ab8360d6e3cdfe042
          path: qwen-vllm-simpler
          persist-credentials: false
      - name: Fetch vLLM
        uses: actions/checkout@v4
        with:
          repository: vllm-project/vllm
          ref: bc150f50299199599673614f80d12a196f377655
          path: qwen-vllm
          persist-credentials: false
      - name: Fetch vLLM-Ascend
        uses: actions/checkout@v4
        with:
          repository: vllm-project/vllm-ascend
          ref: 367b8e62da799870a7476ce34f5f7658589a8aad
          path: qwen-vllm-ascend
          persist-credentials: false
      - name: Build Lib decode artifacts and guard native prefill in four Kernel cases
        working-directory: checkout-vllm
        shell: bash
        run: |
          source activate.sh
          : "${PYPTO_QWEN3_MODEL_DIR:?Configure Qwen3-14B weights on this runner}"
          scripts="$PWD/.github/scripts/qwen-vllm-kernel"
          output="$PWD/build_output/qwen-vllm-kernel-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          simpler="$GITHUB_WORKSPACE/qwen-vllm-simpler"
          vllm="$GITHUB_WORKSPACE/qwen-vllm"
          ascend="$GITHUB_WORKSPACE/qwen-vllm-ascend"
          atb_env="${PYPTO_VLLM_ATB_ENV:-/usr/local/Ascend/nnal/atb/set_env.sh}"
          mkdir -p "$output"
          {
            printf 'lib %s\n' "$(git rev-parse HEAD)"
            printf 'pypto %s\n' "$(git -C "$PYPTO_SRC" rev-parse HEAD)"
            printf 'simpler %s\n' "$(git -C "$simpler" rev-parse HEAD)"
            printf 'runtime pto-isa %s\n' "$(cat "$simpler/pto_isa.pin")"
            printf 'vllm %s\n' "$(git -C "$vllm" rev-parse HEAD)"
            printf 'vllm-ascend %s\n' "$(git -C "$ascend" rev-parse HEAD)"
          } > "$output/source-revisions.log"
          TORCH_DEVICE_BACKEND_AUTOLOAD=0 python "$scripts/compile_decode.py" \
            --model "$PYPTO_QWEN3_MODEL_DIR" --output "$output" \
            |& tee "$output/compile.log"

          if [[ -z ${PYPTO_VLLM_ATB_ENV:-} && ! -r "$atb_env" ]]; then
            # vLLM-Ascend's A3 worker needs ATB. Unpack the vendor runtime in
            # this job's output when it is absent from the runner image.
            nnal=Ascend-cann-nnal_9.0.0_linux-aarch64.run
            (
              export TMPDIR="$output"
              curl --fail --location --retry 2 --retry-all-errors --max-time 300 \
                --referer https://www.hiascend.com/ --output "$output/$nnal" \
                "https://ascend-repo.obs.cn-east-2.myhuaweicloud.com/CANN/CANN%209.0.0/$nnal"
              bash "$output/$nnal" --quiet --noexec --extract="$output/nnal"
              bash "$output/nnal/run_package/Ascend-cann-atb_9.0.0_linux-aarch64.run" \
                --quiet --noexec --extract="$output/atb"
            ) |& tee "$output/atb-setup.log"
            atb_env="$output/atb/atb/set_env.sh"
          fi
          if [[ ! -r "$atb_env" ]]; then
            echo "::error::ATB environment script not found: $atb_env"
            exit 1
          fi
          source "$atb_env" --cxx_abi=1
          export CC=gcc-15 CXX=g++-15
          bash "$scripts/setup_runtime.sh" "$simpler" "$vllm" "$ascend" "$output" |& tee "$output/setup.log"
          export PTO_ISA_ROOT="$output/runtime-pto-isa"
          export XDG_CACHE_HOME="$output/cache"
          (
            source "$output/venv/bin/activate"
            runtime_site="$(python -c 'import sysconfig; print(sysconfig.get_paths()["purelib"])')"
            export PYTHONPATH="$scripts:$PWD:$runtime_site:$ASCEND_HOME_PATH/python/site-packages"
            python "$scripts/prepare_runtime.py" "$output"
          ) |& tee "$output/native-build.log"
          printf -v run_cmd 'source %q && source %q && source %q --cxx_abi=1 && bash %q %q %q' \
            "$PWD/activate.sh" "$output/venv/bin/activate" "$atb_env" "$scripts/run_smoke.sh" "$simpler" "$output"
          task-submit --env PYPTO_QWEN3_MODEL_DIR --env PTO_ISA_ROOT --env XDG_CACHE_HOME --env CC --env CXX \
            --device auto --device-num 1 --timeout 3600 --max-time 1200 --run "$run_cmd" |& tee "$output/task.log"
      - name: Kill orphaned task-submit tasks
        if: always()
        uses: ./.github/actions/kill-orphaned-tasks
        with:
          checkout-path: checkout-vllm
      - name: Upload smoke results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qwen-vllm-kernel-a3
          path: |
            checkout-vllm/build_output/qwen-vllm-kernel-*/*.log
            checkout-vllm/build_output/qwen-vllm-kernel-*/*-result.json
      - name: Clean up build artifacts and runtime environment
        if: always()
        working-directory: checkout-vllm
        run: rm -rf "build_output/qwen-vllm-kernel-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"

  serving-qwen:
    needs: detect-changes
    # PR-only, qwen3-14b (single card). The 8-card DeepSeek V4 run is split into
    # its own job (serving-deepseek) so the two models schedule independently and
    # the expensive 8-card borrow does not serialize behind the single-card run.
    if: >-
      github.event_name == 'pull_request' &&
      needs.detect-changes.outputs.run_qwen_serving_tests == 'true'
    runs-on: [self-hosted, linux, npu, a3]
    # One task-submit worst case: --timeout 3600 queue + --max-time 1800 run,
    # plus setup/build headroom.
    timeout-minutes: 120
    env:
      PTOAS_ROOT: ${{ github.workspace }}/checkout/ptoas-bin
      CMAKE_BUILD_PARALLEL_LEVEL: 16
      CMAKE_C_COMPILER_LAUNCHER: ccache
      CMAKE_CXX_COMPILER_LAUNCHER: ccache
      CCACHE_MAXSIZE: 30G
      # The cache paths are exported by setup-ci-job from the runner config's
      # CI_CACHE_ROOT — a static job-level env: cannot see a step's output.
      CCACHE_UMASK: '000'

    steps:
      - name: Fetch composite action definitions
        uses: actions/checkout@v4
        with:
          sparse-checkout: .github/actions
          clean: false
          persist-credentials: false

      - name: Setup CI job
        uses: ./.github/actions/setup-ci-job
        with:
          checkout-path: checkout
          needs-device: 'true'
          runtime-platform: a2a3
          build-namespace: serving
          toolchain: bundle
          # Serving uses PyPTO/simpler for NPU execution; it does not need
          # torch_npu. Use CPU Torch 2.10 for the model loader dependencies.
          install-torch-npu: 'false'
          torch-version: 'torch==2.10.0'
          # Own ccache: serving's churn must not LRU-evict the a2a3/sim entries.
          ccache-name: ccache-serving
          pip-cache-name: pip-serving

      - name: Run pypto-serving Qwen3-14B tests
        uses: ./.github/actions/pypto-serving-tests
        with:
          pypto-lib-checkout-path: checkout
          pypto-serving-checkout-path: serving-checkout
          model-name: qwen3-14b

      - name: Kill orphaned task-submit tasks
        if: always()
        uses: ./.github/actions/kill-orphaned-tasks
        with:
          checkout-path: checkout

      - name: Clean up build artifacts
        if: always()
        run: rm -rf serving-checkout/build_output

  serving-deepseek:
    needs: detect-changes
    # PR-only, DeepSeek V4 — the 8-card (--device-num 8) serving run, split out
    # of `serving-qwen` so the 8-card borrow schedules independently of the
    # single-card run. Same setup contract; gated by its own model guard.
    if: >-
      github.event_name == 'pull_request' &&
      needs.detect-changes.outputs.run_deepseek_serving_tests == 'true'
    runs-on: [self-hosted, linux, npu, a3]
    # One task-submit worst case: --timeout 3600 queue + --max-time 1800 run,
    # plus setup/build headroom.
    timeout-minutes: 120
    env:
      PTOAS_ROOT: ${{ github.workspace }}/checkout/ptoas-bin
      CMAKE_BUILD_PARALLEL_LEVEL: 16
      CMAKE_C_COMPILER_LAUNCHER: ccache
      CMAKE_CXX_COMPILER_LAUNCHER: ccache
      CCACHE_MAXSIZE: 30G
      # The cache paths are exported by setup-ci-job from the runner config's
      # CI_CACHE_ROOT — a static job-level env: cannot see a step's output.
      CCACHE_UMASK: '000'

    steps:
      - name: Fetch composite action definitions
        uses: actions/checkout@v4
        with:
          sparse-checkout: .github/actions
          clean: false
          persist-credentials: false

      - name: Setup CI job
        uses: ./.github/actions/setup-ci-job
        with:
          checkout-path: checkout
          needs-device: 'true'
          runtime-platform: a2a3
          build-namespace: serving
          toolchain: bundle
          # DeepSeek V4 uses CPU Torch; its V4.1 loader needs Torch 2.10's
          # float8_e8m0fnu dtype and does not need torch_npu in this job.
          install-torch-npu: 'false'
          torch-version: 'torch==2.10.0'
          # Share serving's dedicated ccache so a2a3/sim entries are not evicted.
          ccache-name: ccache-serving
          pip-cache-name: pip-serving

      - name: Run pypto-serving DeepSeek V4 tests
        uses: ./.github/actions/pypto-serving-tests
        with:
          pypto-lib-checkout-path: checkout
          pypto-serving-checkout-path: serving-checkout
          model-name: deepseek-v4
          # Only the fused K=1 case runs on device: the k3-s4-b4 case starts a
          # second 8-card server for the same gate.
          deepseek-mtp-cases: k1

      - name: Kill orphaned task-submit tasks
        if: always()
        uses: ./.github/actions/kill-orphaned-tasks
        with:
          checkout-path: checkout

      - name: Clean up build artifacts
        if: always()
        run: rm -rf serving-checkout/build_output

  serving-dspark:
    needs: detect-changes
    # PR-only, DSpark (deepseek_v4_flash_dspark) — the 8-card EP8 (--device-num 8)
    # serving run of the one-server speculative K=7 case (greedy generation plus
    # grouped prefix cache on a single caching-enabled server), split out like
    # serving-deepseek so the expensive 8-card borrow schedules independently.
    # Same setup contract; gated by its own model guard.
    if: >-
      github.event_name == 'pull_request' &&
      needs.detect-changes.outputs.run_dspark_serving_tests == 'true'
    runs-on: [self-hosted, linux, npu, a3]
    # One task-submit worst case: --timeout 3600 queue + --max-time 2400 run
    # (the K=7 boot compiles the fused one-L2 decode entry on top of the weight
    # upload), plus setup/build headroom.
    timeout-minutes: 135
    env:
      PTOAS_ROOT: ${{ github.workspace }}/checkout/ptoas-bin
      CMAKE_BUILD_PARALLEL_LEVEL: 16
      CMAKE_C_COMPILER_LAUNCHER: ccache
      CMAKE_CXX_COMPILER_LAUNCHER: ccache
      CCACHE_MAXSIZE: 30G
      # The cache paths are exported by setup-ci-job from the runner config's
      # CI_CACHE_ROOT — a static job-level env: cannot see a step's output.
      CCACHE_UMASK: '000'

    steps:
      - name: Fetch composite action definitions
        uses: actions/checkout@v4
        with:
          sparse-checkout: .github/actions
          clean: false
          persist-credentials: false

      - name: Setup CI job
        uses: ./.github/actions/setup-ci-job
        with:
          checkout-path: checkout
          needs-device: 'true'
          runtime-platform: a2a3
          build-namespace: serving
          toolchain: bundle
          # Serving uses PyPTO/simpler for NPU execution; it does not need
          # torch_npu. Use CPU Torch 2.10 for the model loader dependencies.
          install-torch-npu: 'false'
          torch-version: 'torch==2.10.0'
          # Share serving's dedicated ccache so a2a3/sim entries are not evicted.
          ccache-name: ccache-serving
          pip-cache-name: pip-serving

      - name: Run pypto-serving DSpark tests
        uses: ./.github/actions/pypto-serving-tests
        with:
          pypto-lib-checkout-path: checkout
          pypto-serving-checkout-path: serving-checkout
          model-name: deepseek-dspark
          # Only the K=7 case runs on device: the K=0 case starts a second
          # 8-card server for the same gate.
          deepseek-dspark-cases: k7

      - name: Kill orphaned task-submit tasks
        if: always()
        uses: ./.github/actions/kill-orphaned-tasks
        with:
          checkout-path: checkout

      - name: Clean up build artifacts
        if: always()
        run: rm -rf serving-checkout/build_output
