name: CI

on:
  workflow_dispatch:
    inputs:
      devices:
        description: Space-separated device IDs, or auto
        type: string
        default: auto

permissions:
  contents: read

jobs:
  compare-device-toolchains:
    runs-on: [self-hosted, linux, npu, a3]
    timeout-minutes: 45
    env:
      CMAKE_BUILD_PARALLEL_LEVEL: 16
      CMAKE_C_COMPILER_LAUNCHER: ccache
      CMAKE_CXX_COMPILER_LAUNCHER: ccache
      CCACHE_MAXSIZE: 30G
      CCACHE_UMASK: '000'
      PYPTO_BENCH: '0'
    steps:
      - name: Fetch action and diagnostic definitions
        uses: actions/checkout@v4
        with:
          sparse-checkout: .github
          clean: false
          persist-credentials: false
      - name: Prepare compiler before the storage fix
        env:
          PTOAS_ROOT: ${{ github.workspace }}/old/ptoas-bin
        uses: ./.github/actions/setup-ci-job
        with:
          checkout-path: old
          needs-device: 'true'
          build-namespace: pr1579-old
          pip-cache-name: pip-a2a3
          toolchain: bundle
          torch-version: 'torch==2.10.0'
          pypto-ref: 5ab1ff1278524a847c4aecfb11641920966bb0ea
      - name: Prebuild cases before the storage fix
        env:
          PTOAS_ROOT: ${{ github.workspace }}/old/ptoas-bin
        working-directory: old
        shell: bash
        run: |
          source activate.sh
          PYTHONPATH="$PWD:$PYTHONPATH" python "$GITHUB_WORKSPACE/.github/scripts/pr1579_toolchain_probe.py" old compile
      - name: Prepare compiler with the storage fix
        env:
          PTOAS_ROOT: ${{ github.workspace }}/new/ptoas-bin
        uses: ./.github/actions/setup-ci-job
        with:
          checkout-path: new
          needs-device: 'true'
          build-namespace: pr1579-new
          pip-cache-name: pip-a2a3
          toolchain: bundle
          torch-version: 'torch==2.10.0'
          pypto-ref: ef0db9e957ea50fba2eb57342b3fb381a3c7fa91
      - name: Prebuild cases with the storage fix
        env:
          PTOAS_ROOT: ${{ github.workspace }}/new/ptoas-bin
        working-directory: new
        shell: bash
        run: |
          source activate.sh
          PYTHONPATH="$PWD:$PYTHONPATH" python "$GITHUB_WORKSPACE/.github/scripts/pr1579_toolchain_probe.py" new compile
      - name: Compare on the same allocated device
        shell: bash
        env:
          PROBE_DEVICES: ${{ inputs.devices }}
        run: |
          cat > diagnostics/run.sh <<'SH'
          #!/usr/bin/env bash
          set -u
          printf 'ALLOCATED_DEVICE=%s\n' "$TASK_DEVICE"
          npu-smi info || true
          rc=0
          for label in new old new; do
            (
              cd "$GITHUB_WORKSPACE/$label"
              export PTOAS_ROOT="$PWD/ptoas-bin"
              source activate.sh
              export PYTHONPATH="$PWD:$PYTHONPATH"
              python "$GITHUB_WORKSPACE/.github/scripts/pr1579_toolchain_probe.py" "$label" run
            ) || rc=1
          done
          exit "$rc"
          SH
          read -r -a devices <<< "$PROBE_DEVICES"
          rc=0
          for device in "${devices[@]}"; do
            if task-submit --device "$device" --env GITHUB_WORKSPACE --timeout 900 --max-time 240 --run "bash $GITHUB_WORKSPACE/diagnostics/run.sh"; then
              echo "DEVICE_RESULT $device PASS"
            else
              echo "DEVICE_RESULT $device FAIL"
              rc=1
            fi
          done
          exit "$rc"
      - name: Save comparison evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr1579-toolchain-comparison
          retention-days: 7
          path: |
            diagnostics/**/data/**
            diagnostics/**/*.pto
            diagnostics/**/*.cpp
            diagnostics/**/kernel_config.py
            diagnostics/**/report/**
