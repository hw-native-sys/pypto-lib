name: Daily CI

on:
  schedule:
    - cron: '51 20 * * *'  # UTC 20:51 = Shanghai 04:51
  workflow_dispatch:
    inputs:
      performance_only:
        description: Run only the MTP and DSpark operator performance suite
        type: boolean
        default: false

# Every job only reads the repo (checkouts use persist-credentials: false, the
# artifact up/download steps use the run-scoped runtime token, the summaries
# write $GITHUB_STEP_SUMMARY), so the token needs nothing beyond contents:read.
permissions:
  contents: read

jobs:
  model-tests-sim:
    if: ${{ !inputs.performance_only }}
    # Simulator job: no device needed, so it runs on the CPU runner — but on the
    # host, through the same setup-ci-job composite as the a2a3 device job (same
    # user, same bundle venv + activate.sh, same ci-cache). needs-device:false is
    # the only difference: no Ascend env, which the simulator does not use.
    runs-on: [self-hosted, linux, cpu]
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        # Route the model families to their matching simulator: a2a3sim sweeps
        # every A2/A3 model, while a5sim sweeps the V4.1-Flash tree — the same
        # operators the a5 device job runs, on the cases a simulator can take.
        platform: [a2a3sim, a5sim]
    defaults:
      run:
        working-directory: checkout
    env:
      PTOAS_ROOT: ${{ github.workspace }}/checkout/ptoas-bin
      CMAKE_BUILD_PARALLEL_LEVEL: 16
      CMAKE_C_COMPILER_LAUNCHER: ccache
      CMAKE_CXX_COMPILER_LAUNCHER: ccache
      CCACHE_MAXSIZE: 30G
      # Shared with the a2a3 job; 000 keeps cache files mutually writable. Both
      # jobs now run as ci-runner (no container root), but the dir still holds
      # root-owned entries from the container era, so keep the umask.
      # The cache *paths* are exported by setup-ci-job from the runner config's
      # CI_CACHE_ROOT — a static job-level env: cannot see a step's output.
      CCACHE_UMASK: '000'

    steps:
      - name: Fetch composite action definitions
        # Local `uses: ./.github/actions/...` resolves against $GITHUB_WORKSPACE,
        # but this job checks the repo out into ./checkout — sparse-fetch just
        # the action defs at the workspace root first (clean: false leaves sibling
        # subdir checkouts on this persistent runner untouched).
        uses: actions/checkout@v4
        with:
          sparse-checkout: .github/actions
          clean: false
          persist-credentials: false

      - name: Setup CI job
        uses: ./.github/actions/setup-ci-job
        with:
          checkout-path: checkout
          needs-device: 'false'
          build-namespace: ${{ matrix.platform }}
          pip-cache-name: pip-sim
          toolchain: bundle
          # a5sim is the MXFP8 leg: the V4.1-Flash tree holds every MX scale in
          # a torch.float8_e8m0fnu tensor, which 2.6 does not have. 20 of the 24
          # a5sim failures in the 2026-09-19 nightly were that one
          # AttributeError, raised before anything compiled. a2a3sim keeps the
          # default, which is the version the serving torch_npu pin requires.
          torch-version: ${{ matrix.platform == 'a5sim' && 'torch==2.10.0' || 'torch==2.6.0' }}

      - name: Run model tests (${{ matrix.platform }})
        id: sweep
        shell: bash
        env:
          PYTHONPATH: ${{ github.workspace }}/checkout
          PYPTO_LOG_LEVEL: error
          PYPTO_WARNING_LEVEL: none
          # Quiet simpler's runtime logger. On a SIMPLER_PROFILING build every
          # simpler_run emits its [STRACE] timing tree at the INFO_V9 tier, and
          # simpler's logger defaults to INFO — so without this the console floods
          # with markers. PYPTO_LOG_LEVEL/PYPTO_WARNING_LEVEL above drive pypto's
          # own C++ logger, not simpler's; PYPTO_RUNTIME_LOG is simpler's knob.
          # benchmark() still reads timing: it raises this to v9 only around its
          # own fd-captured loop, then restores.
          PYPTO_RUNTIME_LOG: error
        run: |
          source activate.sh
          : > results.tsv
          failed=()
          run_case() {
            local file="$1" label="$2"; shift 2
            echo "::group::${label}"
            if ! timeout --kill-after=10s 300s python "$file" -p ${{ matrix.platform }} "$@"; then
              failed+=("$label")
              echo "::error file=${file}::FAIL (${label})"
              printf '%s\tfail\n' "$label" >> results.tsv
            else
              printf '%s\tpass\n' "$label" >> results.tsv
            fi
            echo "::endgroup::"
          }
          # Run every model file once with no extra args. Files marked
          # `# ci: no-sim` (full multi-layer / multi-card forwards) are
          # device-only and would just argparse-reject *sim, so skip them here.
          for f in $(python .github/scripts/detect_changes.py --all --root models --platform ${{ matrix.platform }}); do
            if grep -qE '^#\s*ci:\s*no-sim' "$f"; then
              echo "::group::${f}"
              echo "skip (no-sim): ${f}"
              echo "::endgroup::"
              continue
            fi
            run_case "$f" "$f"
          done
          if [ ${#failed[@]} -ne 0 ]; then
            echo "Failed cases (${#failed[@]}):"
            printf '  - %s\n' "${failed[@]}"
            exit 1
          fi
          echo "All model tests passed."

      - name: Clean up build artifacts
        if: always()
        run: rm -rf build_output

      - name: Upload results artifact
        # Not a bare always(): on this persistent runner a results.tsv from a
        # previous run survives in the checkout dir, so if the job dies before
        # the sweep (setup failure, checkout failure), an unconditional upload
        # re-publishes the LEFTOVER table and the summary renders days-old
        # results as if they were tonight's — with the ":warning: No results
        # artifact" branch silently defeated. Gate on the sweep step having
        # actually started: it truncates results.tsv first thing, so anything
        # it uploads (even from a failed or cancelled sweep) is from this run.
        if: ${{ always() && steps.sweep.outcome != 'skipped' }}
        uses: ./.github/actions/upload-results
        with:
          name: results-${{ matrix.platform }}
          # upload-artifact resolves `path` against $GITHUB_WORKSPACE and ignores
          # defaults.run.working-directory, so name the checkout dir explicitly.
          path: checkout/results.tsv

  model-tests-a2a3:
    if: ${{ !inputs.performance_only }}
    # Runs directly on the host like pypto's dist-system-tests — multi-card
    # kernels use HCCL, which needs a host-only env (set_env.sh, HCCL plugin
    # paths); under docker the chip child silent-crashes in comm_init. It holds
    # NO card: every model run is wrapped in `task-submit --device "$DEVICE_ID"`
    # (mechanism B), which borrows a card (or an N-card set for the multi-card
    # `# ci: devices=N` files) from the host-level device queue and passes the
    # lent set as $TASK_DEVICE. The backend controls whether DEVICE_ID is `auto`
    # or a fixed card id. Checkout / install happen under ./checkout rather
    # than at the workspace root, so the root holds only the sparsely-fetched
    # action defs and any second repo a job needs sits beside this one.
    runs-on: [self-hosted, linux, npu, a3]
    # Must exceed a single task-submit's worst case (--timeout 3600 queue wait +
    # --max-time 900 run), or the job dies before task-submit's own timeout can
    # ever fire — and the first queued case would eat the whole job budget.
    timeout-minutes: 120
    defaults:
      run:
        working-directory: checkout
    env:
      PTOAS_ROOT: ${{ github.workspace }}/checkout/ptoas-bin
      CMAKE_BUILD_PARALLEL_LEVEL: 16
      CMAKE_C_COMPILER_LAUNCHER: ccache
      CMAKE_CXX_COMPILER_LAUNCHER: ccache
      CCACHE_MAXSIZE: 30G
      # Shared with the sim job via the same ci-cache dir; 000 keeps cache files
      # mutually writable. Both jobs now run as ci-runner, but the dir still holds
      # root-owned entries from the container era, so keep the umask.
      # The cache *paths* are exported by setup-ci-job from the runner config's
      # CI_CACHE_ROOT — a static job-level env: cannot see a step's output.
      CCACHE_UMASK: '000'

    steps:
      - name: Fetch composite action definitions
        # Local `uses: ./.github/actions/...` resolves against $GITHUB_WORKSPACE,
        # but this job checks the repo out into ./checkout — sparse-fetch just
        # the action defs at the workspace root first (clean: false leaves sibling
        # subdir checkouts on this persistent runner untouched).
        uses: actions/checkout@v4
        with:
          sparse-checkout: .github/actions
          clean: false
          persist-credentials: false

      - name: Setup CI job
        uses: ./.github/actions/setup-ci-job
        with:
          checkout-path: checkout
          needs-device: 'true'
          build-namespace: a2a3-daily
          pip-cache-name: pip-a2a3
          toolchain: bundle

      - name: Run model tests (a2a3, via task-submit)
        id: sweep
        shell: bash
        env:
          PYPTO_LOG_LEVEL: error
          PYPTO_WARNING_LEVEL: none
          # Quiet simpler's runtime logger — see the sim job for the full note.
          # Without this a SIMPLER_PROFILING build floods the log with [STRACE]
          # INFO_V9 markers on every dispatch (correctness runs included, not just
          # benchmark's own fd-captured loop). benchmark() still reads timing.
          PYPTO_RUNTIME_LOG: error
          PYPTO_BENCH: '0'  # Correctness only; the dedicated performance job owns timing.
        run: |
          source activate.sh
          set +e
          : > results.tsv
          failed=()
          run_case() {
            local file="$1" label="$2"; shift 2
            echo "::group::${label}"
            # Files needing multiple NPUs declare `# ci: devices=N` (N>1) near
            # the top; borrow that many cards with `--device-num N` (defaults to
            # ep2 / 2-card runs). $TASK_DEVICE is the lent set (a single id, or
            # comma-separated for N>1) and is passed straight to -d. The child's
            # stdout is captured and then printed with the case result.
            local ndev devnum_flag out rc
            ndev=$(grep -oP '#\s*ci:\s*devices=\K[0-9]+' "$file" | head -1)
            ndev=${ndev:-1}
            devnum_flag=""
            [ "$ndev" -gt 1 ] && devnum_flag="--device-num $ndev"
            out=$( task-submit --device "$DEVICE_ID" $devnum_flag --timeout 3600 --max-time 900 \
              --run "cd $GITHUB_WORKSPACE/checkout && source activate.sh && PYPTO_BENCH=0 PYTHONPATH=$GITHUB_WORKSPACE/checkout python $file -p a2a3 -d \$TASK_DEVICE $*" 2>&1 )
            rc=$?
            printf '%s\n' "$out"
            if [ "$rc" -ne 0 ]; then
              failed+=("$label")
              echo "::error file=${file}::FAIL (${label})"
              printf '%s\tfail\n' "$label" >> results.tsv
            else
              printf '%s\tpass\n' "$label" >> results.tsv
            fi
            echo "::endgroup::"
          }
          # Run every model file once at its default world size (ep2 / 2-card).
          for f in $(python .github/scripts/detect_changes.py --all --root models --platform a2a3); do
            run_case "$f" "$f"
          done
          # Higher world sizes (ep4/ep8) are added manually as dedicated wraps
          # below — run_case borrows the marker's 2 cards, so ep4/ep8 need their
          # own --device-num (card pool must provide that many cards), e.g.:
          #   task-submit --device "$DEVICE_ID" --device-num 4 --timeout 3600 --max-time 900 \
          #     --run "cd $GITHUB_WORKSPACE/checkout && source activate.sh && \
          #       PYTHONPATH=$GITHUB_WORKSPACE/checkout \
          #       python models/deepseek_v4_flash_mtp/decode_moe.py -p a2a3 --ep 4 -d \$TASK_DEVICE"
          if [ ${#failed[@]} -ne 0 ]; then
            echo "Failed cases (${#failed[@]}):"
            printf '  - %s\n' "${failed[@]}"
            exit 1
          fi
          echo "All model tests passed."

      - name: Kill orphaned task-submit tasks
        if: always()
        uses: ./.github/actions/kill-orphaned-tasks
        with:
          checkout-path: checkout

      - name: Clean up build artifacts
        if: always()
        working-directory: checkout
        run: rm -rf build_output

      - name: Upload results artifact
        # Gated on the sweep having started — see the sim job's upload step
        # for why a bare always() re-publishes a previous run's leftover
        # results.tsv when the job dies in setup.
        if: ${{ always() && steps.sweep.outcome != 'skipped' }}
        uses: ./.github/actions/upload-results
        with:
          name: results-a2a3
          path: checkout/results.tsv

  model-tests-a5:
    if: ${{ !inputs.performance_only }}
    # All A5 model entries selected by the shared directory platform map.
    runs-on: [self-hosted, linux, npu-a5]
    # The cases run one after another, each bounded by task-submit's own
    # --timeout 3600 queue wait + --max-time 900 run, on top of the build.
    # The declared parallel cases can borrow up to 8 cards.
    timeout-minutes: 240
    defaults:
      run:
        working-directory: checkout
    env:
      PTOAS_ROOT: ${{ github.workspace }}/checkout/ptoas-bin
      CMAKE_BUILD_PARALLEL_LEVEL: 16
      CMAKE_C_COMPILER_LAUNCHER: ccache
      CMAKE_CXX_COMPILER_LAUNCHER: ccache
      CCACHE_MAXSIZE: 30G
      # The cache *paths* are exported by setup-ci-job from the runner config's
      # CI_CACHE_ROOT — a static job-level env: cannot see a step's output.
      CCACHE_UMASK: '000'

    steps:
      - name: Point git at the runner's live proxy
        # The A5 host's git carries a file-scope http(s).proxy that has gone
        # stale (a dead local forwarder — every nightly since 2026-08-07 died
        # in the checkout below with "Failed to connect to 127.0.0.1 port
        # 7890"), and file-scope git config beats the proxy environment. So
        # git dials the dead port while the runner service and curl use the
        # live proxy from the runner's own environment ("Runner is running
        # behind proxy server ..." in Set up job). Re-point git at that same
        # live proxy for this job only: GIT_CONFIG_* is command-scope config,
        # which outranks every config file and touches no host state — when
        # the host's git config is repaired this becomes a harmless no-op, as
        # it already is on runners with no proxy in their environment.
        # Runs before the checkout, so it must not assume ./checkout exists.
        working-directory: ${{ github.workspace }}
        shell: bash
        run: |
          live="${https_proxy:-${HTTPS_PROXY:-}}"
          if [ -n "$live" ]; then
            {
              echo "GIT_CONFIG_COUNT=2"
              echo "GIT_CONFIG_KEY_0=http.proxy"
              echo "GIT_CONFIG_VALUE_0=$live"
              echo "GIT_CONFIG_KEY_1=https.proxy"
              echo "GIT_CONFIG_VALUE_1=$live"
            } >> "$GITHUB_ENV"
            echo "git proxy pinned to the runner's live proxy for this job"
          else
            echo "no proxy in the runner environment — leaving git alone"
          fi

      - name: Fetch composite action definitions
        # Local `uses: ./.github/actions/...` resolves against $GITHUB_WORKSPACE,
        # but this job checks the repo out into ./checkout — sparse-fetch just
        # the action defs at the workspace root first (clean: false leaves
        # sibling subdir checkouts on this persistent runner untouched).
        uses: actions/checkout@v4
        with:
          sparse-checkout: .github/actions
          clean: false
          persist-credentials: false

      - name: Setup CI job
        uses: ./.github/actions/setup-ci-job
        with:
          checkout-path: checkout
          needs-device: 'true'
          build-namespace: a5-daily
          pip-cache-name: pip-a5
          toolchain: bundle
          # The same stack as ci.yml's a5 job, which gates these entries.
          # PyPTO follows the shared default (origin HEAD) like every other job
          # here, so this sweep is also where an upstream break shows up first,
          # attributable to a night rather than to whichever V4.1 pull request
          # happens to run next. torch does not follow it: these entries need
          # `float8_e8m0fnu`, the MXFP8 scale dtype added in 2.7, and a shim is
          # not an option because pypto maps that IR dtype through its own table
          # and the golden runner then compares the two for equality.
          torch-version: 'torch==2.10.0'

      - name: Run A5 model entries via task-submit
        id: sweep
        shell: bash
        env:
          PYPTO_LOG_LEVEL: error
          PYPTO_WARNING_LEVEL: none
          # Quiet simpler's runtime logger — see the sim job for the full note.
          PYPTO_RUNTIME_LOG: error
          PYPTO_BENCH: '0'  # Correctness only; the dedicated performance job owns timing.
        run: |
          source activate.sh
          if [ "${PYPTO_USE_UV:-false}" = "true" ]; then
            uv pip install pytest
          else
            python -m pip install pytest
          fi
          FILES=$(python .github/scripts/detect_changes.py --all --root models --platform a5)
          : > results.tsv
          if [ -n "$FILES" ]; then
            python .github/scripts/run_a5_pytest.py --mode cli --results results.tsv $FILES
          fi

      - name: Kill orphaned task-submit tasks
        if: always()
        uses: ./.github/actions/kill-orphaned-tasks
        with:
          checkout-path: checkout

      - name: Clean up build artifacts
        if: always()
        working-directory: checkout
        run: rm -rf build_output

      - name: Upload results artifact
        # Gated on the sweep having started — see the sim job's upload step
        # for the full note. This job is where the bare always() actually
        # bit: every nightly from 2026-08-07 to 2026-08-11 died in checkout
        # (dead git proxy, fixed by this job's first step) yet re-uploaded a
        # byte-identical results-a5 leftover from the 08-05 sweep, so the
        # summary kept presenting six-day-old numbers as current.
        if: ${{ always() && steps.sweep.outcome != 'skipped' }}
        uses: ./.github/actions/upload-results
        with:
          name: results-a5
          path: checkout/results.tsv

  operator-performance:
    name: MTP and DSpark operator performance (a2a3)
    runs-on: [self-hosted, linux, npu, a3]
    # Twenty serial task-submit cases, each bounded by --timeout 3600.
    timeout-minutes: 300
    concurrency:
      group: operator-performance-a2a3
      cancel-in-progress: false
    defaults:
      run:
        working-directory: operator-checkout
    env:
      PTOAS_ROOT: ${{ github.workspace }}/operator-checkout/ptoas-bin
      CMAKE_BUILD_PARALLEL_LEVEL: 16
      CMAKE_C_COMPILER_LAUNCHER: ccache
      CMAKE_CXX_COMPILER_LAUNCHER: ccache
      CCACHE_MAXSIZE: 30G
      CCACHE_UMASK: '000'
    steps:
      - name: Fetch composite action definitions
        uses: actions/checkout@v4
        with:
          sparse-checkout: .github/actions
          clean: false
          persist-credentials: false

      - name: Setup CI job
        uses: ./.github/actions/setup-ci-job
        with:
          checkout-path: operator-checkout
          needs-device: 'true'
          build-namespace: operator-performance-a2a3
          pip-cache-name: pip-operator-performance
          toolchain: bundle

      - name: Run operator performance cases
        id: perf
        env:
          PERF_DIR: ${{ runner.temp }}/operator-perf-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          source activate.sh
          python .github/scripts/ci_perf.py ci --output-dir "$PERF_DIR"

      - name: Kill orphaned task-submit tasks
        if: always()
        uses: ./.github/actions/kill-orphaned-tasks
        with:
          checkout-path: operator-checkout

      - name: Publish performance summary
        if: ${{ always() && steps.perf.outcome != 'skipped' }}
        env:
          PERF_DIR: ${{ runner.temp }}/operator-perf-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          report="$PERF_DIR/published/report.md"
          if [ -f "$report" ]; then
            cat "$report" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Operator performance produced no report." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload operator performance results
        id: upload
        if: ${{ always() && steps.perf.outcome != 'skipped' }}
        uses: ./.github/actions/upload-results
        with:
          name: operator-perf-${{ github.run_attempt }}
          path: ${{ runner.temp }}/operator-perf-${{ github.run_id }}-${{ github.run_attempt }}/published
          if-no-files-found: error

      - name: Remove private operator builds after uploading evidence
        if: ${{ always() && steps.upload.outcome == 'success' }}
        env:
          PERF_DIR: ${{ runner.temp }}/operator-perf-${{ github.run_id }}-${{ github.run_attempt }}
        run: rm -rf -- "$PERF_DIR/work"

  summary:
    name: Aggregate results summary
    # model-tests-a5 is a real dependency: it is the longest job (hours of
    # serial device cases against the others' ~40 min), so without it here the
    # summary is built before results-a5 exists and the A5 table is empty.
    # `always()` keeps the summary running when any sweep fails.
    needs: [model-tests-sim, model-tests-a2a3, model-tests-a5]
    if: ${{ always() && !inputs.performance_only }}
    runs-on: ubuntu-latest
    steps:
      - name: Download all results
        uses: actions/download-artifact@v4
        with:
          path: results

      - name: Build combined summary table
        run: |
          python3 - <<'EOF' >> "$GITHUB_STEP_SUMMARY"
          import pathlib

          # One table per model family: a2a3 with a2a3sim, and the two A5 legs
          # together, using the shared directory platform configuration.
          ICON = {"pass": ":white_check_mark:", "fail": ":x:", "missing": ":heavy_minus_sign:"}
          ROOT = pathlib.Path("results")

          def load(platform):
              """Case statuses, or None if the job wrote no artifact."""
              tsv = ROOT / f"results-{platform}" / "results.tsv"
              if not tsv.exists():
                  return None
              status = {}
              for line in tsv.read_text().splitlines():
                  if not line.strip():
                      continue
                  parts = line.split("\t")
                  status[parts[0]] = parts[1]
              return status

          def no_artifact(platforms):
              names = ", ".join(f"`{p}`" for p in platforms)
              return (
                  f":warning: No results artifact from {names} — the sweep died "
                  "before writing one, most likely in setup: a sweep that merely "
                  "fails cases still uploads its table."
              )

          def table(title, platforms):
              """Show correctness for each platform, including missing artifacts."""
              data = {p: load(p) for p in platforms}
              present = [p for p in platforms if data[p] is not None]
              missing = [p for p in platforms if data[p] is None]
              print(f"### {title}")
              print()
              if not present:
                  print(no_artifact(missing))
                  print()
                  return
              header = ["Case"]
              for p in platforms:
                  header.append(p)
              print("| " + " | ".join(header) + " |")
              print("| " + " | ".join("---" for _ in header) + " |")
              for case in sorted({c for p in present for c in data[p]}):
                  row = [f"`{case}`"]
                  for p in platforms:
                      row.append(ICON.get((data[p] or {}).get(case, "missing"), "?"))
                  print("| " + " | ".join(row) + " |")
              print()
              print("Passed: " + ", ".join(
                  f"**{p}** {sum(1 for v in data[p].values() if v == 'pass')}"
                  f"/{len(data[p])}" for p in present))
              if missing:
                  print()
                  print(no_artifact(missing) + " Those columns read all `-`.")
              print()

          def a5_table(title, platforms):
              """One table for A5 entries across device and simulator legs.

              The legs key their cases differently: the a5 device job runs every
              pytest node or CLI combination an entry declares and labels each
              case accordingly, while a5sim runs the entry once with no extra arguments. Keying
              the row on the entry itself puts them side by side; a cell that
              stands for more than one case carries its pass count and names the
              cases that failed, so nothing the split tables showed is lost.
              """
              data = {p: load(p) for p in platforms}
              present = [p for p in platforms if data[p] is not None]
              missing = [p for p in platforms if data[p] is None]
              print(f"### {title}")
              print()
              if not present:
                  print(no_artifact(missing))
                  print()
                  return
              # platform -> entry -> {case arguments ("" when it has none): status}
              cases = {p: {} for p in platforms}
              for p in present:
                  for label, status in data[p].items():
                      entry, _, args = label.partition(" ")
                      if "::" in entry:
                          entry, _, node = entry.partition("::")
                          args = node + (" " + args if args else "")
                      cases[p].setdefault(entry, {})[args] = status

              def cell(by_args):
                  """One leg's verdict for one entry, against its whole matrix.

                  The device sweep writes a row for every case the entry
                  declares before it runs any of them, so a case left
                  ``missing`` is one the sweep never reached, not one the entry
                  does not have. The count is therefore out of the declared
                  cases, and an entry the sweep only got part way through reads
                  as incomplete rather than as a smaller entry passing in full.
                  """
                  if not by_args:
                      return ICON["missing"]
                  if list(by_args) == [""]:
                      # No parallel arguments to distinguish, so there is
                      # nothing for a count or a case list to add. Its own
                      # icon, though: a case the sweep never reached reads
                      # :warning:, never the :heavy_minus_sign: that means the
                      # entry has no case on this leg in the first place.
                      status = by_args[""]
                      return ":warning:" if status == "missing" else ICON.get(status, "?")
                  bad = sorted(a for a, s in by_args.items() if s == "fail")
                  unrun = sorted(a for a, s in by_args.items() if s == "missing")
                  icon = ICON["fail"] if bad else (":warning:" if unrun else ICON["pass"])
                  text = f"{icon} {len(by_args) - len(bad) - len(unrun)}/{len(by_args)}"
                  # Name the cases behind the count, except when the entry
                  # ran none at all: there `0/6` already lists them.
                  if len(bad) + len(unrun) == len(by_args) and not bad:
                      return text
                  notes = [f"{what}: " + ", ".join(f"`{a}`" for a in args)
                           for what, args in (("failed", bad), ("not run", unrun)) if args]
                  return text + (" — " + "; ".join(notes) if notes else "")

              print("| Entry | " + " | ".join(platforms) + " |")
              print("| " + " | ".join("---" for _ in range(1 + len(platforms))) + " |")
              for entry in sorted({e for p in present for e in cases[p]}):
                  row = [f"`{entry}`"] + [cell(cases[p].get(entry)) for p in platforms]
                  print("| " + " | ".join(row) + " |")
              print()
              print("Passed: " + ", ".join(
                  f"**{p}** {sum(1 for v in data[p].values() if v == 'pass')}"
                  f"/{len(data[p])} cases" for p in present))
              print()
              print(
                  ":heavy_minus_sign: means the entry has no case on that leg: "
                  "device-only entries carry `# ci: no-sim`. A count is out "
                  "of every pytest or CLI case the entry declares, so a sweep "
                  "that ended early reads :warning: and names the cases it "
                  "never reached."
              )
              if missing:
                  print()
                  print(no_artifact(missing) + " Those columns read all `-`.")
              print()

          print("## Daily CI Model Test Results")
          print()
          table("a2a3 and a2a3sim", ["a2a3", "a2a3sim"])
          a5_table("a5 and a5sim", ["a5", "a5sim"])
          EOF
