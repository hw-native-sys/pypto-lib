name: Daily CI

on:
  schedule:
    - cron: '51 20 * * *'  # UTC 20:51 = Shanghai 04:51
  workflow_dispatch:
    inputs:
      performance_only:
        description: Run only the MTP and DSpark operator performance suite
        type: boolean
        default: false

# Every job only reads the repo (checkouts use persist-credentials: false, the
# artifact up/download steps use the run-scoped runtime token, the summaries
# write $GITHUB_STEP_SUMMARY), so the token needs nothing beyond contents:read.
permissions:
  contents: read

jobs:
  model-tests-sim:
    if: ${{ !inputs.performance_only }}
    # Simulator job: no device needed, so it runs on the CPU runner — but on the
    # host, through the same setup-ci-job composite as the a2a3 device job (same
    # user, same bundle venv + activate.sh, same ci-cache). needs-device:false is
    # the only difference: no npu-smi check and no Ascend env, which the simulator
    # does not use.
    runs-on: [self-hosted, linux, arm64, cpu]
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        # Route the model families to their matching simulator: a2a3sim sweeps
        # every non-Pro model, while a5sim sweeps only the A5-targeted Pro tree.
        platform: [a2a3sim, a5sim]
    defaults:
      run:
        working-directory: checkout
    env:
      PTOAS_ROOT: ${{ github.workspace }}/checkout/ptoas-bin
      CMAKE_BUILD_PARALLEL_LEVEL: 16
      CMAKE_C_COMPILER_LAUNCHER: ccache
      CMAKE_CXX_COMPILER_LAUNCHER: ccache
      CCACHE_MAXSIZE: 30G
      # Shared with the a2a3 job; 000 keeps cache files mutually writable. Both
      # jobs now run as ci-runner (no container root), but the dir still holds
      # root-owned entries from the container era, so keep the umask.
      # The cache *paths* are exported by setup-ci-job from the runner config's
      # CI_CACHE_ROOT — a static job-level env: cannot see a step's output.
      CCACHE_UMASK: '000'

    steps:
      - name: Fetch composite action definitions
        # Local `uses: ./.github/actions/...` resolves against $GITHUB_WORKSPACE,
        # but this job checks the repo out into ./checkout — sparse-fetch just
        # the action defs at the workspace root first (clean: false leaves sibling
        # subdir checkouts on this persistent runner untouched).
        uses: actions/checkout@v4
        with:
          sparse-checkout: .github/actions
          clean: false
          persist-credentials: false

      - name: Setup CI job
        uses: ./.github/actions/setup-ci-job
        with:
          checkout-path: checkout
          needs-device: 'false'
          build-namespace: ${{ matrix.platform }}
          pip-cache-name: pip-sim
          toolchain: bundle
          # a5sim is the MXFP8 leg: both A5 trees hold every MX scale in a
          # torch.float8_e8m0fnu tensor, which 2.6 does not have. 20 of the 24
          # a5sim failures in the 2026-09-19 nightly were that one
          # AttributeError, raised before anything compiled. a2a3sim keeps the
          # default, which is the version the serving torch_npu pin requires.
          torch-version: ${{ matrix.platform == 'a5sim' && 'torch==2.10.0' || 'torch==2.6.0' }}

      - name: Run model tests (${{ matrix.platform }})
        id: sweep
        shell: bash
        env:
          PYTHONPATH: ${{ github.workspace }}/checkout
          PYPTO_LOG_LEVEL: error
          PYPTO_WARNING_LEVEL: none
          # Keep the Pro simulator leg pinned to the Pro preset even if the
          # runner environment selects the optional Flash preset.
          DEEPSEEK_V4_VARIANT: ${{ matrix.platform == 'a5sim' && 'pro' || '' }}
          # Quiet simpler's runtime logger. On a SIMPLER_PROFILING build every
          # simpler_run emits its [STRACE] timing tree at the INFO_V9 tier, and
          # simpler's logger defaults to INFO — so without this the console floods
          # with markers. PYPTO_LOG_LEVEL/PYPTO_WARNING_LEVEL above drive pypto's
          # own C++ logger, not simpler's; PYPTO_RUNTIME_LOG is simpler's knob.
          # benchmark() still reads timing: it raises this to v9 only around its
          # own fd-captured loop, then restores.
          PYPTO_RUNTIME_LOG: error
        run: |
          source activate.sh
          : > results.tsv
          failed=()
          run_case() {
            local file="$1" label="$2"; shift 2
            echo "::group::${label}"
            if ! timeout --kill-after=10s 300s python "$file" -p ${{ matrix.platform }} "$@"; then
              failed+=("$label")
              echo "::error file=${file}::FAIL (${label})"
              printf '%s\tfail\n' "$label" >> results.tsv
            else
              printf '%s\tpass\n' "$label" >> results.tsv
            fi
            echo "::endgroup::"
          }
          # Run every model file once with no extra args. Files marked
          # `# ci: no-sim` (full multi-layer / multi-card forwards) are
          # device-only and would just argparse-reject *sim, so skip them here.
          for f in $(find models -name '*.py' ! -name '*_draft.py' | sort); do
            # a5sim takes both A5 trees; the a2a3 legs take neither. Of the
            # V4.1-Flash directory it keeps whatever a simulator can run: the
            # `# ci: a5` device entries split the `__main__` sentinel and carry
            # `# ci: no-sim`, so the two filters below drop them, which leaves
            # the MoE, gate, expert and transport files. Those declare a5sim
            # among their own `-p` choices and have had no daily run since the
            # A2/A3 sweeps stopped taking this directory.
            if [ "${{ matrix.platform }}" = "a5sim" ]; then
              [[ "$f" == models/deepseek_v4_pro/* || "$f" == models/deepseek_v4_1_flash/* ]] || continue
            elif [[ "$f" == models/deepseek_v4_pro/* || "$f" == models/deepseek_v4_1_flash/* ]]; then
              continue
            fi
            # Shared modules (config.py, helper libs) have no __main__ guard —
            # they are imported by kernels, not run. Running them import-exits 0
            # and shows a misleading pass, so drop them from the report entirely
            # (matches detect_changes.py's `_has_main` runnable definition).
            if ! grep -q '__main__' "$f"; then
              continue
            fi
            if grep -qE '^#\s*ci:\s*no-sim' "$f"; then
              echo "::group::${f}"
              echo "skip (no-sim): ${f}"
              echo "::endgroup::"
              continue
            fi
            run_case "$f" "$f"
          done
          if [ ${#failed[@]} -ne 0 ]; then
            echo "Failed cases (${#failed[@]}):"
            printf '  - %s\n' "${failed[@]}"
            exit 1
          fi
          echo "All model tests passed."

      - name: Clean up build artifacts
        if: always()
        run: rm -rf build_output

      - name: Upload results artifact
        # Not a bare always(): on this persistent runner a results.tsv from a
        # previous run survives in the checkout dir, so if the job dies before
        # the sweep (setup failure, checkout failure), an unconditional upload
        # re-publishes the LEFTOVER table and the summary renders days-old
        # results as if they were tonight's — with the ":warning: No results
        # artifact" branch silently defeated. Gate on the sweep step having
        # actually started: it truncates results.tsv first thing, so anything
        # it uploads (even from a failed or cancelled sweep) is from this run.
        if: ${{ always() && steps.sweep.outcome != 'skipped' }}
        uses: ./.github/actions/upload-results
        with:
          name: results-${{ matrix.platform }}
          # upload-artifact resolves `path` against $GITHUB_WORKSPACE and ignores
          # defaults.run.working-directory, so name the checkout dir explicitly.
          path: checkout/results.tsv

  model-tests-a2a3:
    if: ${{ !inputs.performance_only }}
    # Runs directly on the host like pypto's dist-system-tests — multi-card
    # kernels use HCCL, which needs a host-only env (set_env.sh, HCCL plugin
    # paths); under docker the chip child silent-crashes in comm_init. It holds
    # NO card: every model run is wrapped in `task-submit --device "$DEVICE_ID"`
    # (mechanism B), which borrows a card (or an N-card set for the multi-card
    # `# ci: devices=N` files) from the host-level device queue and passes the
    # lent set as $TASK_DEVICE. The backend controls whether DEVICE_ID is `auto`
    # or a fixed card id. Checkout / install happen under ./checkout rather
    # than at the workspace root, so the root holds only the sparsely-fetched
    # action defs and any second repo a job needs sits beside this one.
    runs-on: [self-hosted, linux, arm64, npu]
    # Must exceed a single task-submit's worst case (--timeout 3600 queue wait +
    # --max-time 900 run), or the job dies before task-submit's own timeout can
    # ever fire — and the first queued case would eat the whole job budget.
    timeout-minutes: 120
    defaults:
      run:
        working-directory: checkout
    env:
      PTOAS_ROOT: ${{ github.workspace }}/checkout/ptoas-bin
      CMAKE_BUILD_PARALLEL_LEVEL: 16
      CMAKE_C_COMPILER_LAUNCHER: ccache
      CMAKE_CXX_COMPILER_LAUNCHER: ccache
      CCACHE_MAXSIZE: 30G
      # Shared with the sim job via the same ci-cache dir; 000 keeps cache files
      # mutually writable. Both jobs now run as ci-runner, but the dir still holds
      # root-owned entries from the container era, so keep the umask.
      # The cache *paths* are exported by setup-ci-job from the runner config's
      # CI_CACHE_ROOT — a static job-level env: cannot see a step's output.
      CCACHE_UMASK: '000'

    steps:
      - name: Fetch composite action definitions
        # Local `uses: ./.github/actions/...` resolves against $GITHUB_WORKSPACE,
        # but this job checks the repo out into ./checkout — sparse-fetch just
        # the action defs at the workspace root first (clean: false leaves sibling
        # subdir checkouts on this persistent runner untouched).
        uses: actions/checkout@v4
        with:
          sparse-checkout: .github/actions
          clean: false
          persist-credentials: false

      - name: Setup CI job
        uses: ./.github/actions/setup-ci-job
        with:
          checkout-path: checkout
          needs-device: 'true'
          build-namespace: a2a3-daily
          pip-cache-name: pip-a2a3
          toolchain: bundle

      - name: Run model tests (a2a3, via task-submit)
        id: sweep
        shell: bash
        env:
          PYPTO_LOG_LEVEL: error
          PYPTO_WARNING_LEVEL: none
          # Quiet simpler's runtime logger — see the sim job for the full note.
          # Without this a SIMPLER_PROFILING build floods the log with [STRACE]
          # INFO_V9 markers on every dispatch (correctness runs included, not just
          # benchmark's own fd-captured loop). benchmark() still reads timing.
          PYPTO_RUNTIME_LOG: error
          PYPTO_BENCH: '0'  # Correctness only; the dedicated performance job owns timing.
        run: |
          source activate.sh
          set +e
          : > results.tsv
          failed=()
          run_case() {
            local file="$1" label="$2"; shift 2
            echo "::group::${label}"
            # Files needing multiple NPUs declare `# ci: devices=N` (N>1) near
            # the top; borrow that many cards with `--device-num N` (defaults to
            # ep2 / 2-card runs). $TASK_DEVICE is the lent set (a single id, or
            # comma-separated for N>1) and is passed straight to -d. The child's
            # stdout is captured and then printed with the case result.
            local ndev devnum_flag out rc
            ndev=$(grep -oP '#\s*ci:\s*devices=\K[0-9]+' "$file" | head -1)
            ndev=${ndev:-1}
            devnum_flag=""
            [ "$ndev" -gt 1 ] && devnum_flag="--device-num $ndev"
            out=$( task-submit --device "$DEVICE_ID" $devnum_flag --timeout 3600 --max-time 900 \
              --run "cd $GITHUB_WORKSPACE/checkout && source activate.sh && PYPTO_BENCH=0 PYTHONPATH=$GITHUB_WORKSPACE/checkout python $file -p a2a3 -d \$TASK_DEVICE $*" 2>&1 )
            rc=$?
            printf '%s\n' "$out"
            if [ "$rc" -ne 0 ]; then
              failed+=("$label")
              echo "::error file=${file}::FAIL (${label})"
              printf '%s\tfail\n' "$label" >> results.tsv
            else
              printf '%s\tpass\n' "$label" >> results.tsv
            fi
            echo "::endgroup::"
          }
          # Run every model file once at its default world size (ep2 / 2-card).
          for f in $(find models -name '*.py' ! -name '*_draft.py' \
              ! -path 'models/deepseek_v4_pro/*' \
              ! -path 'models/deepseek_v4_1_flash/*' | sort); do
            # Skip shared modules with no __main__ guard (config.py, helper libs):
            # they are imported, not run, so they don't belong in the report.
            if ! grep -q '__main__' "$f"; then
              continue
            fi
            run_case "$f" "$f"
          done
          # Higher world sizes (ep4/ep8) are added manually as dedicated wraps
          # below — run_case borrows the marker's 2 cards, so ep4/ep8 need their
          # own --device-num (card pool must provide that many cards), e.g.:
          #   task-submit --device "$DEVICE_ID" --device-num 4 --timeout 3600 --max-time 900 \
          #     --run "cd $GITHUB_WORKSPACE/checkout && source activate.sh && \
          #       PYTHONPATH=$GITHUB_WORKSPACE/checkout \
          #       python models/deepseek_v4_flash_mtp/decode_moe.py -p a2a3 --ep 4 -d \$TASK_DEVICE"
          if [ ${#failed[@]} -ne 0 ]; then
            echo "Failed cases (${#failed[@]}):"
            printf '  - %s\n' "${failed[@]}"
            exit 1
          fi
          echo "All model tests passed."

      - name: Kill orphaned task-submit tasks
        if: always()
        uses: ./.github/actions/kill-orphaned-tasks
        with:
          checkout-path: checkout

      - name: Clean up build artifacts
        if: always()
        working-directory: checkout
        run: rm -rf build_output

      - name: Upload results artifact
        # Gated on the sweep having started — see the sim job's upload step
        # for why a bare always() re-publishes a previous run's leftover
        # results.tsv when the job dies in setup.
        if: ${{ always() && steps.sweep.outcome != 'skipped' }}
        uses: ./.github/actions/upload-results
        with:
          name: results-a2a3
          path: checkout/results.tsv

  model-tests-a5:
    if: ${{ !inputs.performance_only }}
    # Real Ascend 950 (A5) device job — the daily coverage of the DeepSeek
    # V4.1-Flash operators (models/deepseek_v4_1_flash/). They are A5-only: the
    # a2a3 sweeps exclude that directory by path and every entry is
    # `# ci: no-sim`, so a device job is the only place they run at all. The
    # set is the `# ci: a5` marker, the same one ci.yml's a5-v41-flash selects
    # from — but that job runs only the entries a pull request's own diff
    # reaches, and this one runs all of them, every declared parallel case, so
    # an entry no diff touches cannot rot unnoticed.
    #
    # Unlike the V4-Pro sweep it replaces (report-only, 13/35 on device, red
    # from pypto/device-side faults rather than defects here) these entries are
    # green on the pull-request job, so this one gates: red means a regression.
    # V4-Pro keeps its daily correctness run on a5sim above.
    #
    # It goes through the same setup-ci-job as the other device jobs
    # (needs-device:true); the A5 host's own runner .env supplies its CANN_ROOT
    # / cache roots, so no A5-specific path is named here.
    runs-on: [self-hosted, linux, npu-a5]
    # The cases run one after another, each bounded by task-submit's own
    # --timeout 3600 queue wait + --max-time 900 run, on top of the build. The
    # V4-Pro sweep this replaces took 65 min for its 33 single-card cases; this
    # set is twice as many and borrows up to 8 cards, so it queues for longer
    # too.
    timeout-minutes: 240
    defaults:
      run:
        working-directory: checkout
    env:
      PTOAS_ROOT: ${{ github.workspace }}/checkout/ptoas-bin
      CMAKE_BUILD_PARALLEL_LEVEL: 16
      CMAKE_C_COMPILER_LAUNCHER: ccache
      CMAKE_CXX_COMPILER_LAUNCHER: ccache
      CCACHE_MAXSIZE: 30G
      # The cache *paths* are exported by setup-ci-job from the runner config's
      # CI_CACHE_ROOT — a static job-level env: cannot see a step's output.
      CCACHE_UMASK: '000'

    steps:
      - name: Point git at the runner's live proxy
        # The A5 host's git carries a file-scope http(s).proxy that has gone
        # stale (a dead local forwarder — every nightly since 2026-08-07 died
        # in the checkout below with "Failed to connect to 127.0.0.1 port
        # 7890"), and file-scope git config beats the proxy environment. So
        # git dials the dead port while the runner service and curl use the
        # live proxy from the runner's own environment ("Runner is running
        # behind proxy server ..." in Set up job). Re-point git at that same
        # live proxy for this job only: GIT_CONFIG_* is command-scope config,
        # which outranks every config file and touches no host state — when
        # the host's git config is repaired this becomes a harmless no-op, as
        # it already is on runners with no proxy in their environment.
        # Runs before the checkout, so it must not assume ./checkout exists.
        working-directory: ${{ github.workspace }}
        shell: bash
        run: |
          live="${https_proxy:-${HTTPS_PROXY:-}}"
          if [ -n "$live" ]; then
            {
              echo "GIT_CONFIG_COUNT=2"
              echo "GIT_CONFIG_KEY_0=http.proxy"
              echo "GIT_CONFIG_VALUE_0=$live"
              echo "GIT_CONFIG_KEY_1=https.proxy"
              echo "GIT_CONFIG_VALUE_1=$live"
            } >> "$GITHUB_ENV"
            echo "git proxy pinned to the runner's live proxy for this job"
          else
            echo "no proxy in the runner environment — leaving git alone"
          fi

      - name: Fetch composite action definitions
        # Local `uses: ./.github/actions/...` resolves against $GITHUB_WORKSPACE,
        # but this job checks the repo out into ./checkout — sparse-fetch just
        # the action defs at the workspace root first (clean: false leaves
        # sibling subdir checkouts on this persistent runner untouched).
        uses: actions/checkout@v4
        with:
          sparse-checkout: .github/actions
          clean: false
          persist-credentials: false

      - name: Setup CI job
        uses: ./.github/actions/setup-ci-job
        with:
          checkout-path: checkout
          needs-device: 'true'
          build-namespace: a5-daily
          pip-cache-name: pip-a5
          toolchain: bundle
          # The same pair ci.yml's a5-v41-flash job pins, for the same reason:
          # these entries need the MX matmul operand staging from pypto #2671
          # (without it their `pl.matmul_mx` scale operands do not lower) and
          # the `float8_e8m0fnu` MXFP8 scale dtype torch added in 2.7. A torch
          # shim is not an option — pypto maps that IR dtype through its own
          # table and the golden runner compares the two for equality. Keep
          # this in step with that job: a nightly on a different stack than the
          # gate would report on a configuration nothing else runs.
          pypto-ref: 1deae896dfe2c77e6302df1eef712887877264da
          torch-version: 'torch==2.10.0'

      - name: Run V4.1-Flash operators (a5, via task-submit)
        id: sweep
        shell: bash
        env:
          PYPTO_LOG_LEVEL: error
          PYPTO_WARNING_LEVEL: none
          # Quiet simpler's runtime logger — see the sim job for the full note.
          PYPTO_RUNTIME_LOG: error
          PYPTO_BENCH: '0'  # Correctness only; the dedicated performance job owns timing.
        run: |
          source activate.sh
          set +e
          : > results.tsv
          failed=()
          run_case() {
            local file="$1" cards="$2"; shift 2
            local label="$file${*:+ $*}"
            echo "::group::${label}"
            # A case needs TP x DP cards; --device-num borrows that many from
            # the host queue and $TASK_DEVICE is the lent set, passed straight
            # to -d. The multi-card cases reach past this runner's device
            # whitelist, which is what --ignore-whitelist asks the queue for.
            local devnum_flag out rc
            devnum_flag=""
            [ "$cards" -gt 1 ] && devnum_flag="--device-num $cards --ignore-whitelist"
            # < /dev/null: this runs inside a `while read` over the case
            # matrix, and task-submit would otherwise eat the rest of it.
            out=$( task-submit --device "$DEVICE_ID" $devnum_flag --timeout 3600 --max-time 900 \
              --run "cd $GITHUB_WORKSPACE/checkout && source activate.sh && PYPTO_BENCH=0 PYTHONPATH=$GITHUB_WORKSPACE/checkout python $file -p a5 $* -d \$TASK_DEVICE" < /dev/null 2>&1 )
            rc=$?
            printf '%s\n' "$out"
            if [ "$rc" -ne 0 ]; then
              failed+=("$label")
              echo "::error file=${file}::FAIL (${label})"
              printf '%s\tfail\n' "$label" >> results.tsv
            else
              printf '%s\tpass\n' "$label" >> results.tsv
            fi
            echo "::endgroup::"
          }
          # Every V4.1-Flash entry, by the marker detect_changes.py selects on,
          # so an operator joins this sweep the same way it joins the
          # pull-request one: by carrying `# ci: a5`. Nothing here needs
          # editing. The entries split the `__main__` sentinel to stay out of
          # the a2a3 discovery, so it cannot be the filter here.
          for f in $(grep -rlE '^#\s*ci:\s*a5\s*$' models/deepseek_v4_1_flash --include='*.py' | sort); do
            # Each --tp/--dp combination the entry's own command line accepts is
            # one case (.github/scripts/a5_parallel_cases.py); an entry that
            # declares neither runs once.
            if ! matrix=$(PYTHONPATH=$GITHUB_WORKSPACE/checkout python .github/scripts/a5_parallel_cases.py "$f"); then
              failed+=("$f")
              echo "::error file=${f}::cannot read its --tp/--dp choices"
              printf '%s\tfail\n' "$f" >> results.tsv
              continue
            fi
            while read -r cards args; do
              run_case "$f" "$cards" $args
            done <<< "$matrix"
          done
          if [ ${#failed[@]} -ne 0 ]; then
            echo "Failed cases (${#failed[@]}):"
            printf '  - %s\n' "${failed[@]}"
            exit 1
          fi
          echo "All V4.1-Flash A5 cases passed."

      - name: Kill orphaned task-submit tasks
        if: always()
        uses: ./.github/actions/kill-orphaned-tasks
        with:
          checkout-path: checkout

      - name: Clean up build artifacts
        if: always()
        working-directory: checkout
        run: rm -rf build_output

      - name: Upload results artifact
        # Gated on the sweep having started — see the sim job's upload step
        # for the full note. This job is where the bare always() actually
        # bit: every nightly from 2026-08-07 to 2026-08-11 died in checkout
        # (dead git proxy, fixed by this job's first step) yet re-uploaded a
        # byte-identical results-a5 leftover from the 08-05 sweep, so the
        # summary kept presenting six-day-old V4-Pro numbers as current.
        if: ${{ always() && steps.sweep.outcome != 'skipped' }}
        uses: ./.github/actions/upload-results
        with:
          name: results-a5
          path: checkout/results.tsv

  e2e-flash-a5:
    if: ${{ !inputs.performance_only }}
    name: DeepSeek-V4-Flash EP8 end-to-end (a5)
    # The only nightly that runs the whole prompt -> tokens -> text path on real
    # weights; model-tests-a5 covers the operators one by one on synthetic data.
    #
    # Deliberately no continue-on-error and no skip-when-unstaged path. The
    # arrangement this replaces had both, and on 2026-09-14 it reported success
    # in 71 seconds on a runner with no checkpoint: a green tick for a night
    # that never sampled a token. A red result here now means one of three
    # things, and e2e.json says which: the runner is not provisioned, the A5
    # host is sick, or the model stopped generating.
    runs-on: [self-hosted, linux, npu-a5]
    # Job setup on a cold ccache (~25) + task-submit's worst case for the one
    # loop call (--timeout 5400 queue wait + --max-time 2400 run = 130) + the
    # one-time weight conversion (~25) + cleanup and upload (~35).
    timeout-minutes: 320
    defaults:
      run:
        working-directory: checkout
    env:
      PTOAS_ROOT: ${{ github.workspace }}/checkout/ptoas-bin
      CMAKE_BUILD_PARALLEL_LEVEL: 16
      CMAKE_C_COMPILER_LAUNCHER: ccache
      CMAKE_CXX_COMPILER_LAUNCHER: ccache
      CCACHE_MAXSIZE: 30G
      CCACHE_UMASK: '000'
      # This job pins its own pypto revision, and the override is the point:
      # this is the revision the Flash MXFP8/MXFP4 path was brought up and
      # measured on, and the runtime, PTOAS and PTO ISA versions all follow from
      # it. Generation has not been shown on the shared serving pin, so pinning
      # here keeps a red nightly meaning "the model regressed" rather than "the
      # stack moved". Retire this once Flash generation is demonstrated on the
      # shared pin.
      E2E_PYPTO_REF: 3d468f0179b9dd42c0628a8a46dc15e3a3ad5f76
      E2E_PROMPT: The capital of France is
      E2E_DECODE_STEPS: '32'
      E2E_CKPT_REVISION: 60d8d70770c6776ff598c94bb586a859a38244f1

    steps:
      - name: Point git at the runner's live proxy
        # Same workaround as model-tests-a5 (stale file-scope git proxy on the
        # A5 host); command-scope config, no host state touched.
        working-directory: ${{ github.workspace }}
        shell: bash
        run: |
          live="${https_proxy:-${HTTPS_PROXY:-}}"
          if [ -n "$live" ]; then
            {
              echo "GIT_CONFIG_COUNT=2"
              echo "GIT_CONFIG_KEY_0=http.proxy"
              echo "GIT_CONFIG_VALUE_0=$live"
              echo "GIT_CONFIG_KEY_1=https.proxy"
              echo "GIT_CONFIG_VALUE_1=$live"
            } >> "$GITHUB_ENV"
            echo "git proxy pinned to the runner's live proxy for this job"
          else
            echo "no proxy in the runner environment — leaving git alone"
          fi

      - name: Fetch composite action definitions
        uses: actions/checkout@v4
        with:
          sparse-checkout: .github/actions
          clean: false
          persist-credentials: false

      - name: Setup CI job
        uses: ./.github/actions/setup-ci-job
        with:
          checkout-path: checkout
          needs-device: 'true'
          # Own pypto build tree: this job must never share one with the
          # model-tests-a5 sweep (see build-namespace in the action).
          build-namespace: a5-e2e
          pip-cache-name: pip-a5
          toolchain: bundle
          # Every MX scale is a torch.float8_e8m0fnu tensor, and 2.6.0 has no
          # such dtype, so a job that imports the model would die on the
          # attribute. install-torch-npu stays false here, as that input requires.
          torch-version: 'torch==2.10.0'
          pypto-ref: ${{ env.E2E_PYPTO_REF }}

      - name: Install the checkpoint tokenizer
        shell: bash
        run: |
          source activate.sh
          # setup-ci-job builds the job venv with `uv venv`, and that venv carries
          # no pip at all, so the installer is the one it named in PYPTO_USE_UV.
          # A bare `pip install` here resolves to the interpreter's own pip and
          # lands in ~/.local, where the import below cannot see it.
          if ! python -c 'import tokenizers' 2>/dev/null; then
            if [ "${PYPTO_USE_UV:-false}" = "true" ]; then
              uv pip install 'tokenizers>=0.15'
            else
              python -m pip install 'tokenizers>=0.15'
            fi
          fi
          python -c 'import tokenizers; print("tokenizers", tokenizers.__version__)'

      - name: Resolve the pinned checkpoint and its converted weight cache
        id: weights
        shell: bash
        run: |
          # The runner describes where its data lives through its own .env, the
          # same way PYPTO_QWEN3_MODEL_DIR / PYPTO_DSV4_MODEL_DIR already do. No
          # default path and no skip: an unprovisioned runner fails here saying
          # exactly what to provide.
          ckpt="${PYPTO_DSV4_FLASH_CKPT_DIR:-}"
          if [ -z "$ckpt" ] || [ ! -f "$ckpt/model.safetensors.index.json" ] || [ ! -f "$ckpt/tokenizer.json" ]; then
            echo "::error::set PYPTO_DSV4_FLASH_CKPT_DIR in this runner's .env to a deepseek-ai/DeepSeek-V4-Flash checkout at $E2E_CKPT_REVISION (needs model.safetensors.index.json and tokenizer.json)"
            exit 1
          fi
          weights="${PYPTO_DSV4_FLASH_WEIGHTS_DIR:-$CI_CACHE_ROOT/dsv4-flash-weights/flash_ep8_tp2}"
          source activate.sh
          # The cache records the quantization rules and converter revision it
          # was built with. A cache the checked-out conversion code no longer
          # accepts would make this run test yesterday's tensors, so stop and say
          # so. Deliberately never delete it: the directory can be operator-owned
          # and shared, and this job is in no position to decide 200 GiB is junk.
          if [ -f "$weights/manifest.json" ]; then
            if ! reason=$(PYTHONPATH="$GITHUB_WORKSPACE/checkout:$GITHUB_WORKSPACE/checkout/models/deepseek_v4_pro" \
                DEEPSEEK_V4_VARIANT=flash python -c \
                'import pathlib, sys, utils; utils._load_complete_cache(pathlib.Path(sys.argv[1]), ep=8, tp=2)' \
                "$weights" 2>&1); then
              echo "$reason" | tail -n 5
              echo "::error::the converted cache at $weights is not the one this checkout would build. Remove it, or point PYPTO_DSV4_FLASH_WEIGHTS_DIR at a fresh directory, and this job will convert again."
              exit 1
            fi
            echo "reusing the converted cache at $weights"
          else
            echo "converting the pinned checkpoint into $weights (~25 min)"
            mkdir -p "$weights"
            # utils.py has no __main__ guard (it is a helper module, not a case),
            # so the converter runs through main(). Its FlashCheckpoint reader
            # verifies config.json and the shard index against the pinned
            # revision, so the wrong checkpoint fails here, not at token time.
            PYTHONPATH="$GITHUB_WORKSPACE/checkout:$GITHUB_WORKSPACE/checkout/models/deepseek_v4_pro" \
              python -c 'import utils; utils.main()' \
              --variant flash --ep 8 --tp 2 --ckpt "$ckpt" --out "$weights"
          fi
          echo "checkpoint: $ckpt"
          echo "weights:    $weights"
          { echo "ckpt=$ckpt"; echo "weights=$weights"; } >> "$GITHUB_OUTPUT"

      - name: Run the measured EP8 token loop through task-submit
        id: loop
        shell: bash
        env:
          PYPTO_LOG_LEVEL: error
          PYPTO_WARNING_LEVEL: none
          PYPTO_RUNTIME_LOG: error
          CKPT: ${{ steps.weights.outputs.ckpt }}
          WEIGHTS: ${{ steps.weights.outputs.weights }}
        run: |
          source activate.sh
          # No retry. The cross-rank drift of issue #1043 is intermittent, and
          # retrying until it passes is how a nightly stops reporting it.
          rm -f e2e-loop.json
          set +e
          task-submit --device auto --device-num 8 --ignore-whitelist --timeout 5400 --max-time 2400 \
            --run "cd $GITHUB_WORKSPACE/checkout && source activate.sh && PYTHONPATH=$GITHUB_WORKSPACE/checkout \
              python models/deepseek_v4_pro/synthetic_token_loop.py --variant flash --ep 8 --tp 2 \
                -d \$TASK_DEVICE --weights '$WEIGHTS' --tokenizer '$CKPT/tokenizer.json' \
                --prompt '$E2E_PROMPT' --decode-steps $E2E_DECODE_STEPS \
                --result-json $GITHUB_WORKSPACE/checkout/e2e-loop.json" 2>&1 | tee e2e.log
          echo "exit_code=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"

      - name: Validate the measured result and publish it
        # Always: a job that died before the loop still owes the summary a reason.
        if: always()
        shell: bash
        env:
          LOOP_EXIT_CODE: ${{ steps.loop.outputs.exit_code }}
        run: |
          source activate.sh
          python3 - <<'EOF'
          import json
          import os
          import pathlib
          import sys

          # The token loop writes its own structured result, validates finite
          # logits, greedy/sampled agreement and cross-rank token agreement, and
          # refuses to load a cache that does not match the pinned checkpoint.
          # This step decides only what the loop cannot: that it ran at all and
          # produced real text. What the text says is for a reader of the summary
          # to judge; an operator change that breaks the model shows up there, or
          # as a failure below.
          steps_requested = int(os.environ["E2E_DECODE_STEPS"])
          code = int(os.environ.get("LOOP_EXIT_CODE") or 1)
          path = pathlib.Path("e2e-loop.json")
          result, error = {}, None
          try:
              if not path.is_file():
                  raise ValueError("the token loop wrote no result; it did not run or did not finish")
              result = json.loads(path.read_text())
              if code != 0:
                  raise ValueError(f"token-loop task exited with {code}; see e2e.log")
              for name, want in (("status", "pass"), ("mode", "real-weight"),
                                 ("variant", "flash"), ("ep", 8), ("tp", 2),
                                 ("decode_steps_requested", steps_requested)):
                  if result.get(name) != want:
                      raise ValueError(f"result has unexpected {name}: {result.get(name)!r}")
              if len(set(result.get("devices") or [])) != 8:
                  raise ValueError("the loop did not use eight distinct allocated devices")
              ids = result.get("generated_ids") or []
              done = result.get("decode_steps_done")
              if not isinstance(done, int) or done < 1 or len(ids) != done + 1:
                  raise ValueError("no measured decode step completed, or the token count disagrees")
              text = result.get("generated_text")
              if not isinstance(text, str) or not any(c.isalnum() for c in text):
                  raise ValueError(f"generation produced no lexical text: {text!r}")
              # A result without the cross-rank measurement cannot be called a
              # pass: recording it is half of why this job exists.
              if type(result.get("ranks_bit_identical")) is not bool:
                  raise ValueError("the loop recorded no cross-rank verdict")
          except Exception as exc:  # noqa: BLE001 - the message is the report
              error = str(exc)
          # rank_spread is one entry per sampling point and is large; the verdict
          # over the whole run is what the summary shows.
          report = {k: v for k, v in result.items() if k != "rank_spread"}
          report.update(status="fail" if error else "pass", exit_code=code,
                        error=error, prompt=os.environ["E2E_PROMPT"])
          pathlib.Path("e2e.json").write_text(
              json.dumps(report, indent=1, ensure_ascii=False) + "\n")
          print(json.dumps(report, indent=1, ensure_ascii=False))
          sys.exit(1 if error else 0)
          EOF

      - name: Kill orphaned task-submit tasks
        if: always()
        uses: ./.github/actions/kill-orphaned-tasks
        with:
          checkout-path: checkout

      - name: Clean up build artifacts
        if: always()
        working-directory: checkout
        run: rm -rf build_output

      - name: Upload results artifact
        if: always()
        uses: ./.github/actions/upload-results
        with:
          name: results-e2e-a5
          path: |
            checkout/e2e.json
            checkout/e2e-loop.json
            checkout/e2e.log
          if-no-files-found: error

  operator-performance:
    name: MTP and DSpark operator performance (a2a3)
    runs-on: [self-hosted, linux, arm64, npu]
    # Sixteen serial task-submit cases, each bounded by --timeout 3600.
    timeout-minutes: 300
    concurrency:
      group: operator-performance-a2a3
      cancel-in-progress: false
    defaults:
      run:
        working-directory: operator-checkout
    env:
      PTOAS_ROOT: ${{ github.workspace }}/operator-checkout/ptoas-bin
      CMAKE_BUILD_PARALLEL_LEVEL: 16
      CMAKE_C_COMPILER_LAUNCHER: ccache
      CMAKE_CXX_COMPILER_LAUNCHER: ccache
      CCACHE_MAXSIZE: 30G
      CCACHE_UMASK: '000'
    steps:
      - name: Fetch composite action definitions
        uses: actions/checkout@v4
        with:
          sparse-checkout: .github/actions
          clean: false
          persist-credentials: false

      - name: Setup CI job
        uses: ./.github/actions/setup-ci-job
        with:
          checkout-path: operator-checkout
          needs-device: 'true'
          build-namespace: operator-performance-a2a3
          pip-cache-name: pip-operator-performance
          toolchain: bundle

      - name: Run operator performance cases
        id: perf
        env:
          PERF_DIR: ${{ runner.temp }}/operator-perf-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          source activate.sh
          python .github/scripts/ci_perf.py ci --output-dir "$PERF_DIR"

      - name: Kill orphaned task-submit tasks
        if: always()
        uses: ./.github/actions/kill-orphaned-tasks
        with:
          checkout-path: operator-checkout

      - name: Publish performance summary
        if: ${{ always() && steps.perf.outcome != 'skipped' }}
        env:
          PERF_DIR: ${{ runner.temp }}/operator-perf-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          report="$PERF_DIR/published/report.md"
          if [ -f "$report" ]; then
            cat "$report" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Operator performance produced no report." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload operator performance results
        id: upload
        if: ${{ always() && steps.perf.outcome != 'skipped' }}
        uses: ./.github/actions/upload-results
        with:
          name: operator-perf-${{ github.run_attempt }}
          path: ${{ runner.temp }}/operator-perf-${{ github.run_id }}-${{ github.run_attempt }}/published
          if-no-files-found: error

      - name: Remove private operator builds after uploading evidence
        if: ${{ always() && steps.upload.outcome == 'success' }}
        env:
          PERF_DIR: ${{ runner.temp }}/operator-perf-${{ github.run_id }}-${{ github.run_attempt }}
        run: rm -rf -- "$PERF_DIR/work"

  summary:
    name: Aggregate results summary
    # model-tests-a5 is a real dependency: it is the longest job (hours of
    # serial device cases against the others' ~40 min), so without it here the
    # summary is built before results-a5 exists and the A5 table is empty.
    # `always()` keeps the summary running when any sweep fails.
    needs: [model-tests-sim, model-tests-a2a3, model-tests-a5, e2e-flash-a5]
    if: ${{ always() && !inputs.performance_only }}
    runs-on: ubuntu-latest
    steps:
      - name: Download all results
        uses: actions/download-artifact@v4
        with:
          path: results

      - name: Build combined summary table
        run: |
          python3 - <<'EOF' >> "$GITHUB_STEP_SUMMARY"
          import pathlib

          # One table per case set. a2a3 and a2a3sim share theirs; the two A5
          # legs do not, since a5sim sweeps V4-Pro while the a5 device job
          # sweeps the V4.1-Flash entries case by parallel case.
          ICON = {"pass": ":white_check_mark:", "fail": ":x:", "missing": ":heavy_minus_sign:"}
          ROOT = pathlib.Path("results")

          def load(platform):
              """Case statuses, or None if the job wrote no artifact."""
              tsv = ROOT / f"results-{platform}" / "results.tsv"
              if not tsv.exists():
                  return None
              status = {}
              for line in tsv.read_text().splitlines():
                  if not line.strip():
                      continue
                  parts = line.split("\t")
                  status[parts[0]] = parts[1]
              return status

          def no_artifact(platforms):
              names = ", ".join(f"`{p}`" for p in platforms)
              return (
                  f":warning: No results artifact from {names} — the sweep died "
                  "before writing one, most likely in setup: a sweep that merely "
                  "fails cases still uploads its table."
              )

          def table(title, platforms):
              """Show correctness for each platform, including missing artifacts."""
              data = {p: load(p) for p in platforms}
              present = [p for p in platforms if data[p] is not None]
              missing = [p for p in platforms if data[p] is None]
              print(f"### {title}")
              print()
              if not present:
                  print(no_artifact(missing))
                  print()
                  return
              header = ["Case"]
              for p in platforms:
                  header.append(p)
              print("| " + " | ".join(header) + " |")
              print("| " + " | ".join("---" for _ in header) + " |")
              for case in sorted({c for p in present for c in data[p]}):
                  row = [f"`{case}`"]
                  for p in platforms:
                      row.append(ICON.get((data[p] or {}).get(case, "missing"), "?"))
                  print("| " + " | ".join(row) + " |")
              print()
              print("Passed: " + ", ".join(
                  f"**{p}** {sum(1 for v in data[p].values() if v == 'pass')}"
                  f"/{len(data[p])}" for p in present))
              if missing:
                  print()
                  print(no_artifact(missing) + " Those columns read all `-`.")
              print()

          def e2e(title, name):
              """The DeepSeek-V4-Flash EP8 token loop: one run, shown as prompt -> text.

              The job writes e2e.json (status/prompt/generated_text/...) so the
              reviewer sees the actual continuation every day, not just a tick:
              a run that completes but babbles is the failure mode worth catching.
              """
              print(f"### {title}")
              print()
              path = ROOT / f"results-{name}" / "e2e.json"
              if not path.exists():
                  print(no_artifact([name]))
                  print()
                  return
              import json
              r = json.loads(path.read_text())
              status = r.get("status", "missing")
              icon = {"pass": ":white_check_mark: pass",
                      "fail": ":x: fail"}.get(status, f"? {status}")
              print(f"**Status:** {icon}")
              done = r.get("decode_steps_done")
              req = r.get("decode_steps_requested")
              eos = r.get("eos_step")
              steps = f"{done}/{req} decode steps" if done is not None else f"{req} decode steps requested"
              if eos is not None:
                  steps += f" (eos at step {eos})"
              print(f" · EP8/TP2, real weights, {steps}")
              print()
              print("| | |")
              print("|---|---|")
              print(f"| Prompt | `{r.get('prompt', '')}` |")
              def cell(value):
                  # One table cell wrapped in a code span: a pipe or newline would
                  # break the row and a backtick would end the span early.
                  return str(value).replace("|", "\\|").replace("\n", "⏎ ").replace("`", "'")
              text = r.get("generated_text")
              partial = r.get("generated_text_partial")
              if text is not None:
                  print(f"| Generated text | `{cell(text)}` |")
              elif partial:
                  n = r.get("decode_steps_done") or 0
                  print(f"| Generated text (partial: prefill + {n} decode step(s) before the failure) | `{cell(partial)}` |")
              else:
                  print("| Generated text | _(none — the loop did not sample a single token)_ |")
              timings = r.get("timings_ms", {})
              latency = r.get("decode_latency", {})
              throughput = r.get("throughput", {})
              for label, value in (
                  ("Output tokens", r.get("output_tokens_total")),
                  ("Resident TTFT (ms)", timings.get("ttft")),
                  ("Decode mean / p50 / p90 (ms)",
                   " / ".join(f"{latency[key]:.3f}" for key in ("mean_ms", "p50_ms", "p90_ms"))
                   if latency.get("count", 0) else None),
                  ("Decode tokens/s (one sequence, all EP/TP ranks)",
                   throughput.get("decode_tokens_per_second_per_sequence")),
              ):
                  if value is not None:
                      print(f"| {label} | `{cell(value)}` |")
              # Every rank holds the full hidden state and the full vocabulary,
              # so they should be bit-identical. Equal sampled tokens do not show
              # that, and issue #1043 still makes them drift, so say which
              # happened: it separates "the model changed" from "#1043 fired".
              identical = r.get("ranks_bit_identical")
              if identical is not None:
                  print(f"| Ranks bit-identical | `{'yes' if identical else 'no (issue #1043)'}` |")
              if r.get("error"):
                  err = str(r["error"]).replace("|", "\\|")
                  print(f"| Error | `{err}` |")
              print()
              print("Full log: `e2e.log` in the `results-e2e-a5` artifact of this run.")
              print()

          print("## Daily CI Model Test Results")
          print()
          table("a2a3 and a2a3sim", ["a2a3", "a2a3sim"])
          table("a5sim (DeepSeek V4-Pro and V4.1-Flash)", ["a5sim"])
          table("a5 (DeepSeek V4.1-Flash)", ["a5"])
          e2e("a5 DeepSeek-V4-Flash EP8 end-to-end token generation (real weights)", "e2e-a5")
          EOF
