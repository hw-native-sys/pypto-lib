name: Inspect operator performance run

on:
  workflow_dispatch:
    inputs:
      target_run:
        type: string
        required: true
      target_runner:
        type: string
        required: true
      expected_host:
        type: string
        required: true

permissions:
  contents: read

jobs:
  inspect:
    runs-on: [self-hosted, linux, arm64, cpu]
    timeout-minutes: 5
    steps:
      - name: Read active performance checkpoints and bounded log tails
        env:
          TARGET_RUN: ${{ inputs.target_run }}
          TARGET_RUNNER: ${{ inputs.target_runner }}
          EXPECTED_HOST: ${{ inputs.expected_host }}
        run: |
          python3 - <<'PY'
          import datetime
          import json
          import os
          from pathlib import Path
          import re
          import socket
          import subprocess
          import time

          actual = socket.gethostname()
          print(f"Inspection host: {actual}", flush=True)
          if actual != os.environ["EXPECTED_HOST"]:
              raise SystemExit("The selected runner is on another host; no files inspected")
          run_id, runner = os.environ["TARGET_RUN"], os.environ["TARGET_RUNNER"]
          if not run_id.isdigit() or not re.fullmatch(r"npu-[0-9]+", runner):
              raise SystemExit("Invalid target run or runner")
          runner_root = Path(os.environ["RUNNER_TEMP"]).resolve().parents[2] / runner
          root = runner_root / "_work/_temp" / f"operator-perf-{run_id}-1"
          work = root / "work"
          print(f"Target directory: {root}; exists={root.is_dir()}", flush=True)

          def read(path):
              if not path.is_file():
                  print(f"Missing: {path}", flush=True)
                  return {}
              print(f"File: {path.name}; age_seconds={time.time() - path.stat().st_mtime:.1f}", flush=True)
              return json.loads(path.read_text())

          def tail(path):
              if not path.is_file():
                  return ""
              with path.open("rb") as stream:
                  stream.seek(max(0, path.stat().st_size - 12000))
                  text = stream.read(12000).decode(errors="replace")
              print(f"Log: {path}; age_seconds={time.time() - path.stat().st_mtime:.1f}", flush=True)
              print("\n".join(line[:1200] for line in text.splitlines()[-35:]), flush=True)
              return text

          print(json.dumps(read(root / "published/execution.json")), flush=True)
          suite = read(work / "suite-result.json")
          print(json.dumps({key: suite.get(key) for key in
                            ("status", "source_sha", "execution_count", "limits_seconds", "error", "stop_reason")}), flush=True)
          cases = [case for case in suite.get("cases", []) if not case.get("shared_measurement")]
          for case in cases:
              print(json.dumps({key: case.get(key) for key in
                                ("case_id", "status", "devices", "wall_seconds", "submission_wall_seconds", "error")}), flush=True)
          for case in cases:
              if case.get("status") in ("not_run", "pass"):
                  continue
              directory = work / case["case_id"]
              print(json.dumps(read(directory / "measurement.json")), flush=True)
              queue = tail(directory / "queue.log")
              tail(directory / "run.log")
              task_ids = re.findall(r"\btask_[0-9_]+\b", queue)
              if task_ids:
                  result = subprocess.run(["task-submit", "--status", task_ids[-1]],
                                          capture_output=True, text=True, timeout=15)
                  print(result.stdout[-12000:], result.stderr[-2000:], flush=True)
          tail(root / "published/suite.log")

          for command in (["task-submit", "--maintenance", "status"],
                          ["task-submit", "--devices", "status"],
                          ["task-submit", "--list"], ["npu-smi", "info"],
                          ["npu-smi", "info", "-t", "health", "-i", "2", "-c", "0"],
                          ["npu-smi", "info", "-t", "proc-mem", "-i", "2", "-c", "0"],
                          ["npu-smi", "info", "-t", "op-timeout", "-i", "2", "-c", "0"]):
              result = subprocess.run(command, capture_output=True, text=True, timeout=30)
              text = re.sub(r"\x1b\[[0-9;]*m", "", result.stdout)
              print(f"Read-only command: {command}; exit={result.returncode}", flush=True)
              if command[-1] == "--list":
                  for line in text.splitlines():
                      task = re.search(r"(task_[0-9_]+)\s+(\S+)\s*(\[NPU:[^]]*\])?", line)
                      if task:
                          print(" ".join(item for item in task.groups() if item), flush=True)
                      elif "===" in line or re.search(r"\[[0-9,]+\]", line):
                          print(line.split("\u2192")[0], flush=True)
              else:
                  print(text[-14000:], flush=True)
              if result.stderr:
                  print(result.stderr[-2000:], flush=True)

          # Read bounded device-log excerpts from the failed run's time window.
          # Never read task environment snapshots or other tasks' commands.
          since = datetime.datetime(2026, 9, 17, 0, 55, tzinfo=datetime.timezone.utc).timestamp()
          window = re.compile(r"2026-09-17[- T](?:01|09):0[5-9]:")
          errors = re.compile(r"507034|timeout|exception|fault|\berror\b|\[ERROR\]", re.I)
          log_base = Path.home() / "ascend/log"
          log_roots = [log_base / kind / component for kind in ("debug", "run")
                       for component in ("plog", "device-4")]
          log_roots.append(Path("/var/log/npu/slog/host-0"))
          for log_root in log_roots:
              print(f"Device log root: {log_root}", flush=True)
              try:
                  candidates = []
                  deadline = time.monotonic() + 10
                  for index, path in enumerate(log_root.rglob("*")):
                      if index >= 50000 or time.monotonic() >= deadline:
                          print("Log discovery limit reached", flush=True)
                          break
                      if path.is_file() and not path.is_symlink() and ".log" in path.name:
                          modified = path.stat().st_mtime
                          if modified >= since:
                              candidates.append((modified, path))
                  print(f"Recent log candidates: {len(candidates)}", flush=True)
                  for _, path in sorted(candidates, key=lambda item: item[0], reverse=True)[:40]:
                      with path.open("rb") as stream:
                          stream.seek(max(0, path.stat().st_size - 65536))
                          lines = stream.read(65536).decode(errors="replace").splitlines()
                      matches = [line[:1500] for line in lines if window.search(line) and errors.search(line)]
                      if matches:
                          print(f"Device error log: {path}", flush=True)
                          print("\n".join(matches[-25:]), flush=True)
              except OSError as error:
                  print(f"Device log access: {type(error).__name__}: {error}", flush=True)

          selected = []
          checkout = runner_root / "_work/pypto-lib/pypto-lib/operator-checkout"
          for proc in Path("/proc").glob("[0-9]*"):
              try:
                  cwd = Path(os.readlink(proc / "cwd"))
                  command = (proc / "cmdline").read_bytes()
                  if str(cwd).startswith(str(root)) or (
                          cwd == checkout and b"ci_operator_perf.py" in command):
                      selected.append(proc.name)
              except (OSError, ValueError):
                  continue
          if selected:
              subprocess.run(["ps", "-p", ",".join(selected), "-o", "pid,ppid,stat,etime,time,pcpu,comm"], check=False)
          print(f"Inspection finished: {datetime.datetime.now(datetime.timezone.utc).isoformat()}", flush=True)
          PY
