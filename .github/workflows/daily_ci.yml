name: PR bounded A2 validation

on:
  workflow_dispatch:
    inputs:
      case_id:
        description: Reviewed PR to measure against the baseline
        type: choice
        options: ['1361', '1372', '1200']
        required: true
      baseline_sha:
        description: Exact shared baseline commit
        type: string
        required: true
      resume_root:
        description: Retained evidence root from a passing SWA baseline
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: pr-triage-a2a3-${{ inputs.case_id }}
  cancel-in-progress: false

jobs:
  paired-benchmark:
    runs-on: [self-hosted, linux, npu, a3]
    timeout-minutes: 100
    env:
      PTOAS_ROOT: ${{ github.workspace }}/pr-eval-${{ inputs.case_id }}/ptoas-bin
      CMAKE_BUILD_PARALLEL_LEVEL: 16
      CMAKE_C_COMPILER_LAUNCHER: ccache
      CMAKE_CXX_COMPILER_LAUNCHER: ccache
      CCACHE_MAXSIZE: 30G
      CCACHE_UMASK: '000'
      GIT_CONFIG_COUNT: '1'
      GIT_CONFIG_KEY_0: http.version
      GIT_CONFIG_VALUE_0: HTTP/1.1
      CASE_ID: ${{ inputs.case_id }}
      BASELINE_SHA: ${{ inputs.baseline_sha }}
      RESUME_ROOT: ${{ inputs.resume_root }}
    steps:
      - name: Check retained baseline before environment setup
        if: ${{ inputs.resume_root != '' }}
        shell: bash
        run: |
          if [[ ! -f "$RESUME_ROOT/private/measurement/result.json" || ! -d "$RESUME_ROOT/private/baseline" ]]; then
            echo "::error::The previous runner did not retain the baseline evidence directory."
            exit 2
          fi
          echo "Retained baseline evidence is available."

      - name: Fetch composite action definitions
        uses: actions/checkout@v4
        with:
          sparse-checkout: .github/actions
          clean: false
          persist-credentials: false

      - name: Setup CI job
        uses: ./.github/actions/setup-ci-job
        with:
          checkout-path: pr-eval-${{ inputs.case_id }}
          needs-device: 'true'
          build-namespace: pr-triage-a2a3-${{ inputs.case_id }}
          pip-cache-name: pip-pr-triage-${{ inputs.case_id }}
          toolchain: bundle
          torch-version: 'torch==2.10.0'
          pypto-ref: '38a8aa6da24c62bf0c6f6f9ef94deb513fbb4d2e'

      - name: Run paired benchmark through task-submit
        id: benchmark
        shell: bash
        working-directory: pr-eval-${{ inputs.case_id }}
        run: |
          set -Eeuo pipefail
          source activate.sh
          [[ "$BASELINE_SHA" =~ ^[0-9a-f]{40}$ ]] || exit 2
          case "$CASE_ID" in 1361|1372|1200) ;; *) exit 2 ;; esac
          export PERF_ROOT="$CI_CACHE_ROOT/pr-triage-measurements/pr-triage-$CASE_ID-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          printf 'PERF_ROOT=%s\n' "$PERF_ROOT" >> "$GITHUB_ENV"
          mkdir -p "$PERF_ROOT/published" "$PERF_ROOT/private"
          trap 'for result in "$PERF_ROOT/private/measurement/"*.json; do if [[ -f "$result" ]]; then cp -- "$result" "$PERF_ROOT/published/"; fi; done' EXIT
          git fetch --no-tags --depth=1 origin "$BASELINE_SHA"
          git worktree add --detach "$PERF_ROOT/private/baseline" "$BASELINE_SHA"
          git worktree add --detach "$PERF_ROOT/private/candidate" "$BASELINE_SHA"
          git -C "$PERF_ROOT/private/candidate" apply --unidiff-zero "$PWD/.github/scripts/pr_triage/pr$CASE_ID.ported.patch"
          git -C "$PERF_ROOT/private/candidate" diff --check
          git -C "$PERF_ROOT/private/candidate" diff > "$PERF_ROOT/published/evaluated.patch"
          sha256sum ".github/scripts/pr_triage/pr$CASE_ID.ported.patch" > "$PERF_ROOT/published/patch.sha256"
          baseline_root="$PERF_ROOT/private/baseline"
          if [[ -n "$RESUME_ROOT" ]]; then
            [[ "$CASE_ID" == 1372 && -d "$RESUME_ROOT/private/baseline" && -f "$RESUME_ROOT/private/measurement/result.json" && -f "$RESUME_ROOT/published/run.log" ]] || exit 2
            baseline_root="$RESUME_ROOT/private/baseline"
          fi
          args=(python -u -B "$PWD/.github/scripts/pr_triage/benchmark_dspark_pair.py"
            --baseline-root "$baseline_root"
            --candidate-root "$PERF_ROOT/private/candidate"
            --output-dir "$PERF_ROOT/private/measurement" --baseline-control)
          count=1
          if [[ "$CASE_ID" == 1372 ]]; then
            args+=(--case swa --tp 1)
          elif [[ "$CASE_ID" == 1200 ]]; then
            count=4
            args+=(--case hca --tp 4)
          else
            args=(python -u -B "$PWD/.github/scripts/pr_triage/compare_lm_head.py"
              --baseline-repo "$PERF_ROOT/private/baseline"
              --candidate-repo "$PERF_ROOT/private/candidate"
              --output-dir "$PERF_ROOT/private/measurement"
              --head-tp 1 --entry sample --active 128 --rounds 100 --warmup 5)
          fi
          printf -v payload 'cd %q && source %q && ' "$PWD" "$PWD/activate.sh"
          printf -v command '%q ' env PYPTO_LOG_LEVEL=error PYPTO_WARNING_LEVEL=none PYPTO_RUNTIME_LOG=error TORCH_DEVICE_BACKEND_AUTOLOAD=0 "${args[@]}"
          payload+="$command"
          if [[ "$CASE_ID" == 1361 ]]; then
            payload+=' --devices "$TASK_DEVICE"'
          fi
          device_flags=(--device auto --device-num "$count")
          if (( count > 1 )); then device_flags+=(--ignore-whitelist); fi
          if [[ -n "$RESUME_ROOT" ]]; then
            args+=(--resume-root "$RESUME_ROOT" --expected-sdk "$PWD/.github/scripts/pr_triage/swa_expected_sdk.json")
            printf -v command '%q ' env PYPTO_LOG_LEVEL=error PYPTO_WARNING_LEVEL=none PYPTO_RUNTIME_LOG=error TORCH_DEVICE_BACKEND_AUTOLOAD=0 "${args[@]}"
            printf -v payload 'cd %q && source %q && ' "$PWD" "$PWD/activate.sh"
            payload+="$command"
            devices=$(python -c 'import json, os; from pathlib import Path; p=Path(os.environ["RESUME_ROOT"])/"private/measurement/result.json"; print(",".join(str(int(x)) for x in json.loads(p.read_text())["devices"]))')
            device_flags=(--device "$devices" --ignore-whitelist)
          fi
          set +e
          task-submit "${device_flags[@]}" --timeout 1800 --max-time 1800 --run "$payload" 2>&1 | tee "$PERF_ROOT/published/run.log"
          status=${PIPESTATUS[0]}
          set -e
          exit "$status"

      - name: Kill orphaned tasks from this checkout
        if: always()
        uses: ./.github/actions/kill-orphaned-tasks
        with:
          checkout-path: pr-eval-${{ inputs.case_id }}

      - name: Upload paired measurement evidence
        if: ${{ always() && steps.benchmark.outcome != 'skipped' }}
        uses: ./.github/actions/upload-results
        with:
          name: pr-triage-${{ inputs.case_id }}-${{ github.run_attempt }}
          path: ${{ env.PERF_ROOT }}/published
          if-no-files-found: error
