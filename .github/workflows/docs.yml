name: Docs

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Read shared theme revision
        id: theme
        shell: bash
        run: |
          theme_revision=$(cat docs/theme-revision.txt)
          if [[ ! "$theme_revision" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::docs/theme-revision.txt must contain a full Git commit SHA"
            exit 1
          fi
          printf 'revision=%s\n' "$theme_revision" >> "$GITHUB_OUTPUT"

      - name: Checkout shared documentation theme
        uses: actions/checkout@v4
        with:
          repository: hw-native-sys/hw-native-sys.github.io
          ref: ${{ steps.theme.outputs.revision }}
          path: .site-theme
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: |
            docs/requirements.txt
            .site-theme/docs-theme/constraints.txt

      - name: Install documentation dependencies
        run: python -m pip install -r docs/requirements.txt

      - name: Validate documentation structure
        run: |
          python tests/lint/check_docs_nav.py
          python tests/lint/check_public_docs.py
          python -m unittest discover -s tests/docs -v

      - name: Build documentation
        env:
          DOCS_REF: ${{ github.event_name == 'push' && 'main' || github.sha }}
        run: mkdocs build --strict

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
