INHERIT: .site-theme/docs-theme/base.yml

site_name: PyPTO Lib
site_description: PyPTO kernels and end-to-end LLM models for Ascend NPUs
site_url: https://www.pypto.ai/pypto-lib/
repo_url: https://github.com/hw-native-sys/pypto-lib
repo_name: hw-native-sys/pypto-lib
edit_uri: edit/main/docs/

docs_dir: docs
site_dir: site

exclude_docs: |
  _hooks/
  requirements.txt
  theme-revision.txt

theme:
  custom_dir: .site-theme/docs-theme/overrides
  language: en
  # Keep instant navigation alongside the shared layout features.
  features:
    - navigation.instant
    - navigation.tabs
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - content.action.edit
    - content.code.copy
    - search.highlight
    - search.suggest
    - toc.follow

extra:
  pypto_project: pypto-lib

validation:
  nav:
    omitted_files: warn
    not_found: warn
  links:
    not_found: warn
    absolute_links: warn
    unrecognized_links: warn
    anchors: warn

hooks:
  - docs/_hooks/repo_links.py

plugins:
  - search

markdown_extensions:
  - admonition
  - attr_list
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

nav:
  - Home: index.md
  - Get Started:
      - Overview: get-started/index.md
      - Installation and environment: get-started/installation.md
      - Run your first kernel: get-started/first-kernel.md
  - PyPTO Coding:
      - Overview: pypto-coding/index.md
      - L2 programming: pypto-coding/l2-programming.md
      - Operations: pypto-coding/operations.md
      - Loops: pypto-coding/loops.md
      - L3 programming: pypto-coding/l3-programming.md
      - Golden and run: pypto-coding/golden-and-run.md
      - Naming and comments: pypto-coding/naming-and-comments.md
      - CCE extern kernel: pypto-coding/cce-extern-kernel.md
  - Run and Validate:
      - Overview: run-and-validate/index.md
      - Compile and runtime workflow: run-and-validate/compile-runtime-workflow.md
      - Golden Harness: run-and-validate/golden-harness.md
      - Save and replay golden data: run-and-validate/save-and-replay.md
  - Examples: examples/index.md
  - Models:
      - Overview: models/index.md
      - Qwen3-14B:
          - Model overview: models/qwen3_14b/index.md
          - PyPTO Page Attention: models/qwen3_14b/paged_attention_pypto.md
          - Optimization: models/qwen3_14b/optimization.md
      - DeepSeek V4-Flash (MTP):
          - Model overview: models/deepseek_v4_flash_mtp/index.md
          - Decode optimization: models/deepseek_v4_flash_mtp/decode_optimization.md
      - DeepSeek V4-Flash (DSpark): models/deepseek_v4_flash_dspark/index.md
      - DeepSeek V4-Pro: models/deepseek_v4_pro/index.md
  - Debug and Tune:
      - Overview: debug-and-tune/index.md
      - Debugging: debug-and-tune/debugging.md
      - Precision tuning: debug-and-tune/precision-tuning.md
      - Performance tuning: debug-and-tune/performance-tuning.md
      - Dependencies and scheduling: debug-and-tune/dependency-and-scheduling.md
      - Ring heap and scope stats: debug-and-tune/ring-heap-and-scope-stats.md
      - Cube tile tuning: debug-and-tune/cube-tile-tuning.md
      - L2 prefetch: debug-and-tune/l2-prefetch.md
      - In-core simulator profiling: debug-and-tune/incore-simulator-profiling.md
      - CCE in-core profiling: debug-and-tune/cce-incore-profiling.md
